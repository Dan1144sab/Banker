<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Rolling Green Banker"/>
  <title>Rolling Green Banker</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{--green:#1a6b3c;--green2:#2d8f55;--gold:#c9a84c;--goldk:#e8c96a;--cream:#f7f3ea;--dark:#0f1e13;--border:#d4c9ae;--txt:#1a1a1a;--muted:#6b7280;--win:#16a34a;--loss:#dc2626}
    html,body{height:100%;overflow:hidden}
    body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--txt);overscroll-behavior:none}

    .screen{display:none}
    .screen.active{display:block}

    #setup{background:linear-gradient(160deg,var(--dark) 0%,#1a3d24 60%,#0f2b1a 100%);min-height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    #setup.active{display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;gap:16px}

    #game{height:100vh}
    #game.active{display:flex;flex-direction:column}

    #summary{background:linear-gradient(160deg,var(--dark) 0%,#1a3d24 70%);min-height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    #summary.active{display:flex;flex-direction:column;align-items:center;padding:36px 16px 100px;gap:20px;overflow-y:auto;-webkit-overflow-scrolling:touch;height:100vh}

    .logo-i{font-size:36px;text-align:center}
    .logo-t{font-family:'Bebas Neue',sans-serif;font-size:52px;color:var(--gold);letter-spacing:6px;line-height:1;text-align:center}
    .card{background:var(--cream);border-radius:20px;padding:20px 18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
    .flbl{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--green);display:block;margin-bottom:8px}
    .cpills{display:flex;gap:8px}
    .cpill{flex:1;padding:9px;border:2px solid var(--border);background:white;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:16px;cursor:pointer;color:var(--muted)}
    .cpill.on{border-color:var(--green);background:var(--green);color:white}
    .coursebtn{display:flex;border:2px solid var(--border);border-radius:14px;overflow:hidden;height:114px}
    .coursebtn-half{flex:1;border:none;background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-weight:600;font-size:16px;color:var(--muted)}
    .coursebtn-half+.coursebtn-half{border-left:2px solid var(--border)}
    .coursebtn-half.on{background:var(--green);color:white}
    .courselogo{height:90px;width:auto;max-width:100%;object-fit:contain}
    .coursebtn-half.on .courselogo{filter:brightness(0) invert(1)}
    .prow{display:flex;gap:8px;margin-bottom:6px}
    .ni{flex:1;min-width:0;padding:10px 12px;border:2px solid var(--border);border-radius:10px;font-size:16px;background:white;color:var(--txt);-webkit-appearance:none;margin:0;font-family:'DM Sans',sans-serif}
    .ni:focus{outline:none;border-color:var(--green)}
    .hi{width:72px;padding:10px 6px;border:2px solid var(--border);border-radius:10px;font-size:16px;background:white;color:var(--txt);-webkit-appearance:none;text-align:center;flex-shrink:0;font-family:'DM Sans',sans-serif}
    .hi:focus{outline:none;border-color:var(--green)}
    .teeup{width:100%;padding:14px;background:var(--green);color:white;border:none;border-radius:12px;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;cursor:pointer}
    .teeup:disabled{opacity:0.4}
    .hres{width:46px;flex-shrink:0;font-size:16px;font-weight:700;color:var(--muted);text-align:center;align-self:center}
    .hres.netres{color:var(--green)}
    .pmbtn{width:40px;height:40px;flex-shrink:0;border-radius:10px;border:2px solid var(--border);background:white;font-size:20px;font-weight:700;color:var(--green);cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center}

    .topbar{background:var(--dark);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding-top:max(14px,env(safe-area-inset-top))}
    .gtitle{font-family:'Bebas Neue',sans-serif;color:var(--gold);font-size:26px;letter-spacing:3px}
    .sumbtn{padding:7px 14px;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:12px;cursor:pointer;background:var(--gold);color:var(--dark)}
    .gscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:40px}

    .lb{background:white;margin:12px 12px 6px;border-radius:14px;border:1.5px solid var(--border);overflow:hidden}
    .lbh{background:var(--green);padding:9px 14px;display:flex;justify-content:space-between;align-items:center}
    .lbt{font-family:'Bebas Neue',sans-serif;color:white;font-size:17px;letter-spacing:2px}
    .lbs{color:rgba(255,255,255,0.6);font-size:11px}
    .lbr{display:flex;align-items:center;padding:8px 14px;gap:10px;border-bottom:1px solid #f0e8d8}
    .lbr:last-child{border-bottom:none}
    .lbr.lead{background:rgba(201,168,76,0.08)}
    .lbp{font-size:11px;font-weight:700;color:var(--muted);width:14px}
    .lbn{flex:1;font-weight:500;font-size:13px}
    .lba{font-weight:700;font-size:14px}
    .lba.pos{color:var(--win)}.lba.neg{color:var(--loss)}

    .hnav{display:flex;gap:5px;padding:5px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
    .hnav::-webkit-scrollbar{display:none}
    .hn{min-width:34px;height:34px;border-radius:7px;border:1.5px solid var(--border);background:white;font-weight:600;font-size:12px;cursor:pointer;color:var(--muted);flex-shrink:0;font-family:'DM Sans',sans-serif}
    .hn.done{background:var(--green);border-color:var(--green);color:white}
    .hn.cur{border-color:var(--gold);color:var(--gold);font-weight:700}

    .hcard{margin:5px 12px;background:white;border-radius:14px;border:1.5px solid var(--border);overflow:hidden}
    .hcard.locked{opacity:0.88}
    .hhdr{background:var(--green);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
    .hlbl{display:block;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.6);font-weight:600}
    .hnum{font-family:'Bebas Neue',sans-serif;font-size:34px;color:white;line-height:1}
    .hinfo{font-size:11px;color:rgba(255,255,255,0.5);text-align:center;line-height:1.6}
    .bbadge{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,0.25);border-radius:20px;padding:5px 10px}
    .bnm{color:var(--goldk);font-weight:600;font-size:13px}
    .sec{padding:11px 16px;border-bottom:1px solid #f0e8d8}
    .slbl{display:block;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--green);margin-bottom:9px}

    .bpills{display:flex;gap:6px;flex-wrap:wrap}
    .bpill{flex:1;min-width:56px;padding:9px 6px;border:2px solid var(--border);background:white;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);text-align:center;font-family:'DM Sans',sans-serif}
    .bpill.on{border-color:var(--gold);background:var(--gold);color:var(--dark)}

    .limrow{display:flex;align-items:flex-start;gap:8px}
    .limf{flex:1}
    .liml{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:1px}
    .limdiv{padding-top:22px;font-size:12px;color:var(--muted)}
    .lpills{display:flex;flex-wrap:wrap;gap:4px}
    .lp{padding:4px 6px;border:1.5px solid var(--border);background:white;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;min-width:38px;text-align:center}
    .lp.on{border-color:var(--green);background:var(--green);color:white}
    .limsum{margin-top:8px;font-size:11px;color:var(--muted);background:#f7f3ea;border-radius:7px;padding:6px 9px}

    .wrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .wrow:last-child{margin-bottom:0}
    .wnm{font-weight:600;font-size:13px;min-width:60px}
    .wpills{display:flex;flex-wrap:wrap;gap:4px}
    .wp{padding:5px 7px;border:1.5px solid var(--border);background:white;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;min-width:40px;text-align:center}
    .wp.on{border-color:var(--gold);background:var(--gold);color:var(--dark)}

    .prows{display:flex;flex-direction:column}
    .prow2{padding:10px 0;border-bottom:1px solid #f3ede0}
    .prow2:last-child{border-bottom:none}
    .prow2.ib{background:rgba(26,107,60,0.03);border-radius:7px;padding:10px 5px}
    .ptop{display:flex;align-items:center;gap:10px}
    .pinfo{flex:1}
    .pname{font-weight:600;font-size:14px;display:block}
    .btag{font-size:10px;letter-spacing:1.5px;color:var(--green);font-weight:700;margin-top:1px;display:block}
    .wtag{font-size:11px;color:var(--gold);font-weight:600;margin-top:1px;display:block}
    .iarea{display:flex;align-items:center;gap:8px}
    .sbadge{font-size:11px;font-weight:700;background:#fef3c7;color:#d97706;border-radius:5px;padding:2px 5px}
    .sinp{width:56px;height:46px;text-align:center;border:2px solid var(--border);border-radius:9px;font-size:22px;font-weight:700;font-family:'Bebas Neue',sans-serif;color:var(--dark);background:var(--cream);-webkit-appearance:none}
    .sinp:focus{outline:none;border-color:var(--green)}
    .sinp:disabled{opacity:0.55;background:#eee}
    .nbadge{font-size:12px;font-weight:700;background:#ede9fe;color:#7c3aed;border-radius:5px;padding:2px 6px}
    .rchip{font-size:13px;font-weight:700;padding:5px 9px;border-radius:7px;min-width:50px;text-align:center}
    .rchip.win{background:#dcfce7;color:var(--win)}
    .rchip.loss{background:#fee2e2;color:var(--loss)}
    .rchip.push{background:#f3f4f6;color:var(--muted)}

    .pressrow{display:flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap}
    .presslbl{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted)}
    .prbtn{padding:4px 10px;border-radius:18px;border:1.5px solid var(--border);background:white;font-size:11px;font-weight:700;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif}
    .prbtn.p2{border-color:#f97316;background:#f97316;color:white}
    .prbtn.p3{border-color:#dc2626;background:#dc2626;color:white}
    .prbtn.pb2{border-color:#7c3aed;background:#7c3aed;color:white}
    .fbet{font-size:12px;font-weight:700;background:#f0e8d8;border-radius:7px;padding:3px 8px;margin-left:auto}

    .hfoot{padding:12px 16px}
    .lbtn{width:100%;padding:13px;background:var(--green);color:white;border:none;border-radius:9px;font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1.5px;cursor:pointer}
    .lbtn:disabled{opacity:0.35;font-size:13px;letter-spacing:0.5px;font-family:'DM Sans',sans-serif;font-weight:600}
    .ubtn{width:100%;padding:10px;background:transparent;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif}

    .smtitle{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--gold);letter-spacing:4px}
    .smcard{width:100%;max-width:440px;background:var(--cream);border-radius:18px;overflow:hidden}
    .smrow{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid var(--border);gap:12px}
    .smrow:last-child{border-bottom:none}
    .smrk{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--muted);width:26px}
    .smrk.g{color:var(--gold)}
    .smnm{flex:1;font-weight:600;font-size:16px}
    .smam{font-family:'Bebas Neue',sans-serif;font-size:28px}
    .smam.pos{color:var(--win)}.smam.neg{color:var(--loss)}
    .smlog{width:100%;max-width:440px}
    .smstats{width:100%;max-width:440px;background:rgba(255,255,255,0.06);border-radius:14px;padding:6px 16px}
    .stt{font-family:'Bebas Neue',sans-serif;color:rgba(255,255,255,0.45);font-size:15px;letter-spacing:2px;text-align:center;padding:10px 0 6px}
    .strow{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.08)}
    .strow:last-child{border-bottom:none}
    .stl{font-size:11px;color:rgba(255,255,255,0.45);flex:1;line-height:1.4}
    .stv{text-align:right;flex-shrink:0}
    .stvn{font-weight:600;font-size:14px;color:white;display:block}
    .stvs{font-size:11px;color:var(--goldk);display:block;margin-top:1px}
    .logt{font-family:'Bebas Neue',sans-serif;color:rgba(255,255,255,0.4);font-size:15px;letter-spacing:2px;text-align:center;margin-bottom:6px}
    .logr{background:rgba(255,255,255,0.06);border-radius:9px;padding:9px 12px;margin-bottom:5px}
    .logrh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
    .lrh{font-family:'Bebas Neue',sans-serif;color:var(--gold);font-size:17px;min-width:32px}
    .lrb{font-size:11px;color:rgba(255,255,255,0.4)}
    .lrl{font-size:11px;color:rgba(255,255,255,0.25);margin-left:auto}
    .lrres{display:flex;gap:6px;flex-wrap:wrap}
    .lrc{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px}
    .lrc.pos{background:rgba(22,163,74,0.2);color:#4ade80}
    .lrc.neg{background:rgba(220,38,38,0.2);color:#f87171}
    .lrc.zero{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.35)}
    .smbrow{display:flex;gap:10px}
    .smbtn{padding:13px 28px;background:var(--gold);color:var(--dark);border:none;border-radius:12px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer}
  </style>
</head>
<body>

<div id="setup" class="screen active">
  <div><div class="logo-i">⛳</div><div class="logo-t" style="font-size:38px;letter-spacing:3px">ROLLING GREEN BANKER</div></div>
  <div class="card">
    <div>
      <label class="flbl">Course</label>
      <div class="coursebtn" id="coursepills">
        <button class="coursebtn-half on" data-course="home"><img class="courselogo" src="rg.png" alt="Rolling Green CC"></button>
        <button class="coursebtn-half" data-course="away">Away</button>
      </div>
    </div>
    <div id="teesection">
      <label class="flbl">Tees</label>
      <div class="cpills" id="teepills">
        <button class="cpill on" data-tee="white">White</button>
        <button class="cpill" data-tee="blue">Blue</button>
      </div>
      <div id="teeinfo" style="font-size:12px;color:var(--muted);margin-top:6px;text-align:center"></div>
    </div>
    <div id="awaysection" style="display:none">
      <label class="flbl">Rating &amp; Slope</label>
      <div class="prow">
        <input type="number" step="0.1" class="ni" id="awayrating" placeholder="Rating">
        <input type="number" step="1" class="ni" id="awayslope" placeholder="Slope">
      </div>
    </div>
    <div style="text-align:center">
      <label class="flbl" style="text-align:center">Number of Players</label>
      <div style="display:flex;align-items:center;justify-content:center;gap:10px">
        <button type="button" class="pmbtn" id="pcminus">−</button>
        <input type="number" class="hi" id="playercount" min="2" max="6" step="1" value="4">
        <button type="button" class="pmbtn" id="pcplus">+</button>
      </div>
    </div>
    <div>
      <div class="prow" style="margin-bottom:2px">
        <span class="flbl" style="flex:1;margin-bottom:0">Player Names</span>
        <span class="flbl" style="width:72px;flex-shrink:0;margin-bottom:0;text-align:center">Index</span>
        <span class="flbl" style="width:46px;flex-shrink:0;margin-bottom:0;text-align:center">Hcp</span>
        <span class="flbl" style="width:46px;flex-shrink:0;margin-bottom:0;text-align:center">Net</span>
      </div>
      <div id="ninputs"></div>
    </div>
    <button class="teeup" id="teeup" disabled>Tee It Up →</button>
  </div>
</div>

<div id="game" class="screen">
  <div class="topbar">
    <span class="gtitle">⛳ BANKER</span>
    <button class="sumbtn" id="sumbtn">Summary</button>
  </div>
  <div class="gscroll">
    <div id="lb"></div>
    <div class="hnav" id="hnav"></div>
    <div id="hcard"></div>
  </div>
</div>

<div id="summary" class="screen">
  <div class="smtitle">🏆 Final Scores</div>
  <div id="smcard" class="smcard"></div>
  <div id="smstats" class="smstats"></div>
  <div id="smlog" class="smlog"></div>
  <div class="smbrow">
    <button class="smbtn" id="backbtn">← Back</button>
    <button class="smbtn" id="newbtn">New Game</button>
  </div>
</div>

<script src="banker-logic.js"></script>
<script>
function activeTee(){
  if(G.course==='away'){
    var r=parseFloat(document.getElementById('awayrating').value),
        s=parseFloat(document.getElementById('awayslope').value);
    return {rating:isNaN(r)?COURSE.rating:r, slope:isNaN(s)?COURSE.slope:s};
  }
  return TEES[G.tee];
}

function renderCourseUI(){
  var btns=document.querySelectorAll('#coursepills .coursebtn-half');
  for(var i=0;i<btns.length;i++) btns[i].classList.toggle('on',btns[i].dataset.course===G.course);
  document.getElementById('teesection').style.display=G.course==='away'?'none':'block';
  document.getElementById('awaysection').style.display=G.course==='away'?'block':'none';
  renderTeeInfo();
}

function renderTeeInfo(){
  var btns=document.querySelectorAll('#teepills .cpill');
  for(var i=0;i<btns.length;i++) btns[i].classList.toggle('on',btns[i].dataset.tee===G.tee);
  var t=TEES[G.tee];
  document.getElementById('teeinfo').textContent='Rating '+t.rating+' · Slope '+t.slope;
}

function updateLiveHandicaps(){
  var rows=document.querySelectorAll('#ninputs .prow');
  var tee=activeTee();
  var idx=[],validIdx=[],validPos=[];
  for(var i=0;i<rows.length;i++){
    var v=parseFloat(rows[i].querySelector('.hi').value);
    idx.push(isNaN(v)?null:v);
    if(!isNaN(v)){validIdx.push(v);validPos.push(i);}
  }
  var net=validIdx.length?netHandicaps(validIdx,tee):[];
  for(var i=0;i<rows.length;i++){
    var hcpres=rows[i].querySelector('.hcpres'),netres=rows[i].querySelector('.netres');
    var pos=validPos.indexOf(i);
    if(pos===-1){hcpres.textContent='';netres.textContent='';continue;}
    hcpres.textContent=courseHdcp(idx[i],tee);
    netres.textContent=net[pos]===0?'0':'+'+net[pos];
  }
}

function setCount(n){
  G.count=n;
  buildInputs();
}

function buildInputs(){
  var c=document.getElementById('ninputs');
  var oldn=c.querySelectorAll('.ni'),oldh=c.querySelectorAll('.hi');
  var en=[],eh=[];
  for(var i=0;i<oldn.length;i++) en.push(oldn[i].value);
  for(var i=0;i<oldh.length;i++) eh.push(oldh[i].value);
  c.innerHTML='';
  for(var i=0;i<G.count;i++){
    var row=document.createElement('div');
    row.className='prow';
    var ni=document.createElement('input');
    ni.type='text'; ni.className='ni'; ni.placeholder='Player '+(i+1);
    ni.value=en[i]||''; ni.autocomplete='off';
    ni.addEventListener('input',chkValid);
    var hi=document.createElement('input');
    hi.type='number'; hi.className='hi'; hi.placeholder='Index';
    hi.min='-10'; hi.max='45'; hi.step='0.1';
    hi.value=eh[i]||'';
    hi.addEventListener('input',function(){chkValid();updateLiveHandicaps();});
    var hcpres=document.createElement('span');
    hcpres.className='hres hcpres';
    var netres=document.createElement('span');
    netres.className='hres netres';
    row.appendChild(ni); row.appendChild(hi); row.appendChild(hcpres); row.appendChild(netres);
    c.appendChild(row);
  }
  chkValid();
  updateLiveHandicaps();
}

function chkValid(){
  var c=document.getElementById('ninputs');
  var ns=c.querySelectorAll('.ni'),hs=c.querySelectorAll('.hi');
  var ok=true;
  for(var i=0;i<ns.length;i++) if(!ns[i].value.trim()) ok=false;
  for(var i=0;i<hs.length;i++) if(hs[i].value==='') ok=false;
  if(G.course==='away'){
    var ar=document.getElementById('awayrating').value,as=document.getElementById('awayslope').value;
    if(ar===''||as==='') ok=false;
  }
  document.getElementById('teeup').disabled=!ok;
}

function startGame(){
  var ns=document.querySelectorAll('#ninputs .ni'),hs=document.querySelectorAll('#ninputs .hi');
  var tee=activeTee();
  G.players=[];
  var idx=[];
  for(var i=0;i<ns.length;i++){
    G.players.push(ns[i].value.trim());
    idx.push(parseFloat(hs[i].value)||0);
  }
  applyHandicaps(G.players,idx,tee);
  G.holes=initHoles(G.players); G.active=0;
  showScreen('game'); renderGame();
}

function showScreen(id){
  var ids=['setup','game','summary'];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    el.classList.toggle('active',ids[i]===id);
  }
}

function renderGame(){renderLB();renderNav();renderCard();}

function renderLB(){
  var t=calcTotals();
  var sorted=G.players.slice().sort(function(a,b){return t[b]-t[a];});
  var hp=G.holes.filter(function(h){return h.locked;}).length;
  var h='<div class="lb"><div class="lbh"><span class="lbt">LEADERBOARD</span><span class="lbs">'+hp+'/18</span></div>';
  for(var i=0;i<sorted.length;i++){
    var p=sorted[i],v=t[p],ch=G.chdcp[p]||0;
    h+='<div class="lbr'+(i===0&&v>0?' lead':'')+'"><span class="lbp">'+(i+1)+'</span>';
    h+='<span class="lbn">'+p+' <span style="font-size:10px;color:var(--muted)">CH'+ch+'</span></span>';
    h+='<span class="lba'+(v>0?' pos':v<0?' neg':'')+'">'+fmt(v)+'</span></div>';
  }
  h+='</div>';
  document.getElementById('lb').innerHTML=h;
}

function renderNav(){
  var h='';
  for(var i=0;i<G.holes.length;i++){
    var hole=G.holes[i];
    h+='<button class="hn'+(hole.locked?' done':'')+(i===G.active?' cur':'')+'" data-hi="'+i+'">'+(i+1)+'</button>';
  }
  document.getElementById('hnav').innerHTML=h;
}

function renderCard(){
  var hi=G.active,hole=G.holes[hi];
  var locked=hole.locked,result=locked?calcResult(hole):null;
  var bset=!!hole.banker,hd=COURSE.holes[hi],pm=holeMult(hi);
  var vw=BETS.filter(function(v){return v>=hole.lmin&&v<=hole.lmax;});
  var nonB=G.players.filter(function(p){return p!==hole.banker;});
  var allW=bset&&nonB.every(function(p){return hole.wagers[p]!=null;});
  var allS=bset&&G.players.every(function(p){return String(hole.strokes[p]).trim()!=='';});
  var ready=allW&&allS;
  var lockLbl=!bset?'Select Banker':!allW?'All Players Must Wager':!allS?'Enter All Scores':'Lock Hole '+hole.hole;

  var h='<div class="hcard'+(locked?' locked':'')+'"><div class="hhdr">';
  h+='<div><span class="hlbl">HOLE</span><span class="hnum">'+hole.hole+'</span></div>';
  h+='<div class="hinfo">PAR '+hd.par+'<br>SI '+hd.si+'</div>';
  h+='<div class="bbadge"><span>🏦</span><span class="bnm">'+(hole.banker||'—')+'</span></div></div>';

  if(!locked){
    h+='<div class="sec"><span class="slbl">① WHO\'S THE BANKER?</span><div class="bpills">';
    for(var i=0;i<G.players.length;i++){
      var p=G.players[i];
      h+='<button class="bpill'+(hole.banker===p?' on':'')+'" data-action="banker" data-p="'+p+'">'+p+'</button>';
    }
    h+='</div></div>';
  }

  if(bset&&!locked){
    h+='<div class="sec"><span class="slbl">② BANKER SETS LIMITS</span><div class="limrow">';
    h+='<div class="limf"><label class="liml">MIN</label><div class="lpills">';
    for(var i=0;i<BETS.length;i++){var v=BETS[i];if(v>hole.lmax)continue;h+='<button class="lp'+(hole.lmin===v?' on':'')+'" data-action="lmin" data-v="'+v+'">$'+v+'</button>';}
    h+='</div></div><div class="limdiv">to</div><div class="limf"><label class="liml">MAX</label><div class="lpills">';
    for(var i=0;i<BETS.length;i++){var v=BETS[i];if(v<hole.lmin)continue;h+='<button class="lp'+(hole.lmax===v?' on':'')+'" data-action="lmax" data-v="'+v+'">$'+v+'</button>';}
    h+='</div></div></div>';
    if(vw.length>0) h+='<div class="limsum">Allowed: '+vw.map(function(v){return'$'+v;}).join(', ')+' · Max ('+pm+'×+bank): $'+(hole.lmax*pm*pm)+'</div>';
    h+='</div>';
  }

  if(bset&&!locked){
    h+='<div class="sec"><span class="slbl">③ PLAYER WAGERS</span>';
    for(var i=0;i<nonB.length;i++){
      var p=nonB[i];
      h+='<div class="wrow"><span class="wnm">'+p+'</span><div class="wpills">';
      for(var j=0;j<vw.length;j++){var v=vw[j];h+='<button class="wp'+(hole.wagers[p]===v?' on':'')+'" data-action="wager" data-p="'+p+'" data-v="'+v+'">$'+v+'</button>';}
      h+='</div></div>';
    }
    h+='</div>';
  }

  if(bset){
    h+='<div class="sec"><span class="slbl">'+(locked?'SCORES & RESULTS':'④ SCORES & PRESS')+'</span><div class="prows">';
    for(var i=0;i<G.players.length;i++){
      var p=G.players[i],ib=p===hole.banker;
      var pr=hole.press[p]||{player:false,banker:false};
      var bw=hole.wagers[p];
      var fwv=bw!=null?finalWager(bw,pr,hi):null;
      var m=calcMult(pr,hi);
      var stk=getStrokes(p,hi),gross=Number(hole.strokes[p]),net=gross?gross-stk:null;
      var rv=result?(result[p]||0):null;
      var cc=rv>0?'win':rv<0?'loss':'push';

      h+='<div class="prow2'+(ib?' ib':'')+'"><div class="ptop"><div class="pinfo"><span class="pname">'+p+'</span>';
      if(ib) h+='<span class="btag">BANKER</span>';
      if(!ib&&bw!=null) h+='<span class="wtag">'+(m>1?'base $'+bw+' → $'+fwv:'$'+bw)+'</span>';
      h+='</div><div class="iarea">';
      if(stk>0) h+='<span class="sbadge">+'+stk+'</span>';
      h+='<input type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="15" class="sinp"'+(locked?' disabled':'')+' value="'+hole.strokes[p]+'" placeholder="—" data-action="score" data-p="'+p+'"/>';
      if(net&&stk>0) h+='<span class="nbadge">net '+net+'</span>';
      if(locked&&rv!==null) h+='<div class="rchip '+cc+'">'+fmt(rv)+'</div>';
      h+='</div></div>';

      if(!ib&&!locked&&bw!=null){
        h+='<div class="pressrow"><span class="presslbl">PRESS:</span>';
        h+='<button class="prbtn'+(pr.player?(pm===3?' p3':' p2'):'')+'" data-action="press" data-p="'+p+'">'+pm+'× Press</button>';
        h+='<button class="prbtn'+(pr.banker?' pb2':'')+'" data-action="bpress" data-p="'+p+'">🏦 '+pm+'× Bank</button>';
        if(fwv&&m>1) h+='<span class="fbet">$'+fwv+'</span>';
        h+='</div>';
      }
      if(!ib&&locked&&bw!=null){
        var pd=[];
        if(pr.player) pd.push(pm+'× pressed');
        if(pr.banker) pd.push('🏦 '+pm+'× bank');
        if(pd.length) h+='<div class="pressrow"><span style="font-size:11px;color:var(--muted)">'+pd.join(' + ')+' → $'+fwv+'</span></div>';
      }
      h+='</div>';
    }
    h+='</div></div>';
  }

  h+='<div class="hfoot">';
  h+=locked?'<button class="ubtn" data-action="unlock">✏️ Edit Hole</button>':'<button class="lbtn"'+(ready?'':' disabled')+' data-action="lock">'+lockLbl+'</button>';
  h+='</div></div>';
  document.getElementById('hcard').innerHTML=h;
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]'); if(!el) return;
  var a=el.dataset.action,p=el.dataset.p,v=el.dataset.v;
  var hole=G.holes[G.active];

  if(a==='banker'){
    hole.banker=p;
    for(var i=0;i<G.players.length;i++){hole.wagers[G.players[i]]=null;hole.press[G.players[i]]={player:false,banker:false};}
    renderGame();
  } else if(a==='lmin'){
    hole.lmin=Number(v); if(hole.lmax<hole.lmin) hole.lmax=hole.lmin;
    for(var i=0;i<G.players.length;i++){var pl=G.players[i];if(hole.wagers[pl]!=null&&(hole.wagers[pl]<hole.lmin||hole.wagers[pl]>hole.lmax)){hole.wagers[pl]=null;hole.press[pl]={player:false,banker:false};}}
    renderGame();
  } else if(a==='lmax'){
    hole.lmax=Number(v); if(hole.lmin>hole.lmax) hole.lmin=hole.lmax;
    for(var i=0;i<G.players.length;i++){var pl=G.players[i];if(hole.wagers[pl]!=null&&(hole.wagers[pl]<hole.lmin||hole.wagers[pl]>hole.lmax)){hole.wagers[pl]=null;hole.press[pl]={player:false,banker:false};}}
    renderGame();
  } else if(a==='wager'){
    hole.wagers[p]=Number(v); hole.press[p]={player:false,banker:false}; renderGame();
  } else if(a==='press'){
    hole.press[p].player=!hole.press[p].player; renderGame();
  } else if(a==='bpress'){
    hole.press[p].banker=!hole.press[p].banker; renderGame();
  } else if(a==='lock'){
    hole.locked=true;
    if(G.active<HOLES-1) G.active++;
    renderGame();
    setTimeout(function(){var nav=document.getElementById('hnav');if(nav.children[G.active])nav.children[G.active].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});},100);
  } else if(a==='unlock'){
    hole.locked=false; renderGame();
  }
});

document.getElementById('hnav').addEventListener('click',function(e){
  var b=e.target.closest('.hn'); if(!b) return;
  G.active=parseInt(b.dataset.hi); renderGame();
});

document.addEventListener('input',function(e){
  if(!e.target.classList.contains('sinp')) return;
  G.holes[G.active].strokes[e.target.dataset.p]=e.target.value;
  renderLB();
  var hole=G.holes[G.active];
  var nonB=G.players.filter(function(p){return p!==hole.banker;});
  var allW=!!hole.banker&&nonB.every(function(p){return hole.wagers[p]!=null;});
  var allS=!!hole.banker&&G.players.every(function(p){return String(hole.strokes[p]).trim()!=='';});
  var btn=document.querySelector('.lbtn');
  if(btn){btn.disabled=!(allW&&allS);if(allW&&allS)btn.textContent='Lock Hole '+hole.hole;}
});

function renderSummary(){
  var t=calcTotals(),sorted=G.players.slice().sort(function(a,b){return t[b]-t[a];});
  var h='';
  for(var i=0;i<sorted.length;i++){var p=sorted[i],v=t[p];h+='<div class="smrow"><span class="smrk'+(i===0?' g':'')+'">'+( i+1)+'</span><span class="smnm">'+p+'</span><span class="smam'+(v>0?' pos':v<0?' neg':'')+'">'+fmt(v)+'</span></div>';}
  document.getElementById('smcard').innerHTML=h;

  // ---- Betting stats ----
  var lh=G.holes.filter(function(x){return x.locked;});
  var totalBet={}, bankRisk={}, bankHoles={}, biggest={amt:0,who:null,hole:null}, topLimit={amt:0,who:null,hole:null}, anyBets=false;
  for(var i=0;i<G.players.length;i++){totalBet[G.players[i]]=0;bankRisk[G.players[i]]=0;bankHoles[G.players[i]]=0;}
  for(var i=0;i<lh.length;i++){
    var hole=lh[i], hi=hole.hole-1, holeExp=0;
    if(hole.lmax>topLimit.amt){topLimit={amt:hole.lmax,who:hole.banker,hole:hole.hole};}
    for(var j=0;j<G.players.length;j++){
      var p=G.players[j];
      if(p===hole.banker||hole.wagers[p]==null) continue;
      var fw=finalWager(hole.wagers[p],hole.press[p],hi);
      totalBet[p]+=fw; holeExp+=fw; anyBets=true;
      if(fw>biggest.amt){biggest={amt:fw,who:p,hole:hole.hole};}
    }
    if(hole.banker){bankRisk[hole.banker]+=holeExp;bankHoles[hole.banker]++;}
  }
  var sh='<div class="stt">BETTING STATS</div>';
  if(anyBets){
    var bigSpender=G.players.slice().sort(function(a,b){return totalBet[b]-totalBet[a];})[0];
    sh+='<div class="strow"><span class="stl">Most wagered<br>(total risked across the round)</span>'
      + '<span class="stv"><span class="stvn">'+bigSpender+'</span><span class="stvs">$'+totalBet[bigSpender]+'</span></span></div>';
    sh+='<div class="strow"><span class="stl">Biggest single bet<br>(after presses)</span>'
      + '<span class="stv"><span class="stvn">'+biggest.who+'</span><span class="stvs">$'+biggest.amt+' on hole '+biggest.hole+'</span></span></div>';
    sh+='<div class="strow"><span class="stl">Highest limit offered<br>(by the banker)</span>'
      + '<span class="stv"><span class="stvn">'+topLimit.who+'</span><span class="stvs">$'+topLimit.amt+' on hole '+topLimit.hole+'</span></span></div>';
    var bigBanker=G.players.slice().sort(function(a,b){return bankRisk[b]-bankRisk[a];})[0];
    sh+='<div class="strow"><span class="stl">Most risked as banker<br>(total covered across the round)</span>'
      + '<span class="stv"><span class="stvn">'+bigBanker+'</span><span class="stvs">$'+bankRisk[bigBanker]+' over '+bankHoles[bigBanker]+' hole'+(bankHoles[bigBanker]===1?'':'s')+'</span></span></div>';
    sh+='<div class="strow"><span class="stl">Total risked as banker</span><span class="stv">'
      + G.players.slice().sort(function(a,b){return bankRisk[b]-bankRisk[a];}).map(function(p){
          return '<span class="stvn" style="font-weight:500;font-size:13px">'+p+' &nbsp;<span style="color:var(--goldk)">$'+bankRisk[p]+'</span></span>';
        }).join('')
      + '</span></div>';
    sh+='<div class="strow"><span class="stl">Total wagered by player</span><span class="stv">'
      + G.players.slice().sort(function(a,b){return totalBet[b]-totalBet[a];}).map(function(p){
          return '<span class="stvn" style="font-weight:500;font-size:13px">'+p+' &nbsp;<span style="color:var(--goldk)">$'+totalBet[p]+'</span></span>';
        }).join('')
      + '</span></div>';
  } else {
    sh+='<div class="strow"><span class="stl">No holes locked yet.</span></div>';
  }
  document.getElementById('smstats').innerHTML=sh;

  // ---- Hole by hole ----
  var lh2='<div class="logt">HOLE BY HOLE</div>';
  for(var i=0;i<lh.length;i++){
    var hole=lh[i],r=calcResult(hole);
    lh2+='<div class="logr"><div class="logrh"><span class="lrh">H'+hole.hole+'</span><span class="lrb">🏦 '+hole.banker+'</span><span class="lrl">$'+hole.lmin+'-$'+hole.lmax+'</span></div><div class="lrres">';
    for(var j=0;j<G.players.length;j++){var p=G.players[j],v=r?(r[p]||0):0;lh2+='<span class="lrc '+(v>0?'pos':v<0?'neg':'zero')+'">'+p+': '+fmt(v)+'</span>';}
    lh2+='</div></div>';
  }
  document.getElementById('smlog').innerHTML=lh2;
}

document.getElementById('teeup').addEventListener('click',startGame);
document.getElementById('sumbtn').addEventListener('click',function(){showScreen('summary');renderSummary();});
document.getElementById('backbtn').addEventListener('click',function(){showScreen('game');renderGame();});
document.getElementById('newbtn').addEventListener('click',function(){showScreen('setup');});

var pc=document.getElementById('playercount');
pc.addEventListener('input',function(){
  var n=parseInt(pc.value);
  if(isNaN(n)||n<2||n>6) return;
  setCount(n);
});
pc.addEventListener('change',function(){
  var n=parseInt(pc.value);
  if(isNaN(n)) n=4;
  n=Math.max(2,Math.min(6,n));
  pc.value=n;
  setCount(n);
});
document.getElementById('pcminus').addEventListener('click',function(){
  var n=Math.max(2,(parseInt(pc.value)||4)-1);
  pc.value=n; setCount(n);
});
document.getElementById('pcplus').addEventListener('click',function(){
  var n=Math.min(6,(parseInt(pc.value)||4)+1);
  pc.value=n; setCount(n);
});

document.getElementById('coursepills').addEventListener('click',function(e){
  var b=e.target.closest('.coursebtn-half'); if(!b) return;
  G.course=b.dataset.course; renderCourseUI(); chkValid(); updateLiveHandicaps();
});
document.getElementById('teepills').addEventListener('click',function(e){
  var b=e.target.closest('.cpill'); if(!b) return;
  G.tee=b.dataset.tee; renderTeeInfo(); chkValid(); updateLiveHandicaps();
});
document.getElementById('awayrating').addEventListener('input',function(){chkValid();updateLiveHandicaps();});
document.getElementById('awayslope').addEventListener('input',function(){chkValid();updateLiveHandicaps();});

G.count=4;
buildInputs();
renderCourseUI();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Rolling Green Banker"/>
  <title>Rolling Green Banker</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{--green:#1a6b3c;--green2:#2d8f55;--gold:#c9a84c;--goldk:#e8c96a;--cream:#f7f3ea;--dark:#0f1e13;--border:#d4c9ae;--txt:#1a1a1a;--muted:#6b7280;--win:#16a34a;--loss:#dc2626}
    html,body{height:100%;overflow:hidden}
    body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--txt);overscroll-behavior:none}

    .screen{display:none}
    .screen.active{display:block}

    #setup{background:linear-gradient(160deg,var(--dark) 0%,#1a3d24 60%,#0f2b1a 100%);min-height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    #setup.active{display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;gap:16px;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}

    #game{height:100vh}
    #game.active{display:flex;flex-direction:column}

    #summary{background:linear-gradient(160deg,var(--dark) 0%,#1a3d24 70%);min-height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    #summary.active{display:flex;flex-direction:column;align-items:center;padding:36px 16px 100px;gap:20px;overflow-y:auto;-webkit-overflow-scrolling:touch;height:100vh}

    .logo-i{font-size:36px;text-align:center}
    .logo-t{font-family:'Bebas Neue',sans-serif;font-size:52px;color:var(--gold);letter-spacing:6px;line-height:1;text-align:center}
    .card{background:var(--cream);border-radius:20px;padding:20px 18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;flex-shrink:0}
    .flbl{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--green);display:block;margin-bottom:8px}
    .cpills{display:flex;gap:8px}
    .cpill{flex:1;padding:9px;border:2px solid var(--border);background:white;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:16px;cursor:pointer;color:var(--muted)}
    .cpill.on{border-color:var(--green);background:var(--green);color:white}
    .coursebtn{display:flex;border:2px solid var(--border);border-radius:14px;overflow:hidden;height:97px}
    .coursebtn-half{flex:1;border:none;background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-weight:600;font-size:16px;color:var(--muted)}
    .coursebtn-half+.coursebtn-half{border-left:2px solid var(--border)}
    .coursebtn-half.on{background:var(--green);color:white}
    .courselogo{height:77px;width:auto;max-width:100%;object-fit:contain}
    .coursebtn-half.on .courselogo{filter:brightness(0) invert(1)}
    .prow{display:flex;gap:8px;margin-bottom:6px}
    .ni{flex:1;min-width:0;padding:10px 12px;border:2px solid var(--border);border-radius:10px;font-size:16px;background:white;color:var(--txt);-webkit-appearance:none;margin:0;font-family:'DM Sans',sans-serif}
    .ni:focus{outline:none;border-color:var(--green)}
    .ni.bad{border-color:var(--loss)}
    .hi{width:72px;padding:10px 6px;border:2px solid var(--border);border-radius:10px;font-size:16px;background:white;color:var(--txt);-webkit-appearance:none;text-align:center;flex-shrink:0;font-family:'DM Sans',sans-serif}
    .hi:focus{outline:none;border-color:var(--green)}
    .teeup{width:100%;padding:14px;background:var(--green);color:white;border:none;border-radius:12px;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;cursor:pointer}
    .teeup:disabled{opacity:0.4}
    .cancelsetup{width:100%;padding:11px;background:transparent;border:1.5px solid var(--border);border-radius:12px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
    .editnote{background:rgba(201,168,76,0.16);border:1.5px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5;color:#6b5420}
    .editsettled{background:white;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.7}
    .editsettled b{color:var(--green);letter-spacing:0.5px}
    .coursebtn.lk{opacity:0.5;pointer-events:none}
    .addp{width:100%;margin-top:8px;padding:10px;background:white;border:2px dashed var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:13px;color:var(--green);cursor:pointer}
    .addp:disabled{opacity:0.4;color:var(--muted);cursor:default}
    .inchk{width:46px;flex-shrink:0;align-self:stretch;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .inchk input{width:22px;height:22px;accent-color:var(--green);cursor:pointer;margin:0}
    .rowbtn{width:46px;flex-shrink:0;padding:0;border:2px solid var(--border);border-radius:10px;background:white;font-size:15px;line-height:1;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif}
    .inhint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:2px}
    .prow.hid .ni,.prow.hid .hi{opacity:0.45;text-decoration:line-through}
    .hres{width:46px;flex-shrink:0;font-size:16px;font-weight:700;color:var(--muted);text-align:center;align-self:center}
    .hres.netres{color:var(--green)}
    .pmbtn{width:40px;height:40px;flex-shrink:0;border-radius:10px;border:2px solid var(--border);background:white;font-size:20px;font-weight:700;color:var(--green);cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center}

    .sigrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
    .sicell{display:flex;flex-direction:column;align-items:center;gap:3px}
    .sih{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:0.5px}
    .siinp{width:100%;min-width:0;padding:6px 2px;border:2px solid var(--border);border-radius:8px;font-size:14px;text-align:center;background:white;color:var(--txt);-webkit-appearance:none;font-family:'DM Sans',sans-serif}
    .siinp:focus{outline:none;border-color:var(--green)}
    .siinp.bad{border-color:var(--loss)}
    .sigridmsg{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
    .sigridmsg.bad{color:var(--loss)}
    .sigridmsg.ok{color:var(--win)}

    .topbar{background:var(--dark);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding-top:max(14px,env(safe-area-inset-top))}
    .gtitle{font-family:'Bebas Neue',sans-serif;color:var(--gold);font-size:26px;letter-spacing:3px}
    .sumbtn{padding:7px 14px;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:12px;cursor:pointer;background:var(--gold);color:var(--dark)}
    .topbtns{display:flex;gap:7px}
    .setupbtn{padding:7px 12px;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:12px;cursor:pointer;background:transparent;border:1.5px solid rgba(255,255,255,0.3);color:var(--goldk)}
    .hnote{padding:16px;text-align:center;font-size:13px;color:var(--muted);line-height:1.5}
    .gscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:40px}

    .lb{background:white;margin:12px 12px 6px;border-radius:14px;border:1.5px solid var(--border);overflow:hidden}
    .lbh{background:var(--green);padding:9px 14px;display:flex;justify-content:space-between;align-items:center}
    .lbt{font-family:'Bebas Neue',sans-serif;color:white;font-size:17px;letter-spacing:2px}
    .lbs{color:rgba(255,255,255,0.6);font-size:11px}
    .lbr{display:flex;align-items:center;padding:8px 14px;gap:10px;border-bottom:1px solid #f0e8d8}
    .lbr:last-child{border-bottom:none}
    .lbr.lead{background:rgba(201,168,76,0.08)}
    .lbp{font-size:11px;font-weight:700;color:var(--muted);width:14px}
    .lbn{flex:1;font-weight:500;font-size:13px}
    .lba{font-weight:700;font-size:14px}
    .lba.pos{color:var(--win)}.lba.neg{color:var(--loss)}

    .hnav{display:flex;gap:5px;padding:5px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
    .hnav::-webkit-scrollbar{display:none}
    .hn{min-width:34px;height:34px;border-radius:7px;border:1.5px solid var(--border);background:white;font-weight:600;font-size:12px;cursor:pointer;color:var(--muted);flex-shrink:0;font-family:'DM Sans',sans-serif}
    .hn.done{background:var(--green);border-color:var(--green);color:white}
    .hn.cur{border-color:var(--gold);color:var(--gold);font-weight:700}

    .hcard{margin:5px 12px;background:white;border-radius:14px;border:1.5px solid var(--border);overflow:hidden}
    .hcard.locked{opacity:0.88}
    .hhdr{background:var(--green);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
    .hlbl{display:block;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.6);font-weight:600}
    .hnum{font-family:'Bebas Neue',sans-serif;font-size:34px;color:white;line-height:1}
    .hinfo{font-size:11px;color:rgba(255,255,255,0.5);text-align:center;line-height:1.6}
    .bbadge{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,0.25);border-radius:20px;padding:5px 10px}
    .bnm{color:var(--goldk);font-weight:600;font-size:13px}
    .sec{padding:11px 16px;border-bottom:1px solid #f0e8d8}
    .slbl{display:block;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--green);margin-bottom:9px}

    .bpills{display:flex;gap:6px;flex-wrap:wrap}
    .bpill{flex:1;min-width:56px;padding:9px 6px;border:2px solid var(--border);background:white;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);text-align:center;font-family:'DM Sans',sans-serif}
    .bpill.on{border-color:var(--gold);background:var(--gold);color:var(--dark)}

    .limrow{display:flex;align-items:flex-start;gap:8px}
    .limf{flex:1}
    .liml{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:1px}
    .limdiv{padding-top:22px;font-size:12px;color:var(--muted)}
    .lpills{display:flex;flex-wrap:wrap;gap:4px}
    .lp{padding:4px 6px;border:1.5px solid var(--border);background:white;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;min-width:38px;text-align:center}
    .lp.on{border-color:var(--green);background:var(--green);color:white}
    .limsum{margin-top:8px;font-size:11px;color:var(--muted);background:#f7f3ea;border-radius:7px;padding:6px 9px}

    .wrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .wrow:last-child{margin-bottom:0}
    .wnm{font-weight:600;font-size:13px;min-width:60px}
    .wpills{display:flex;flex-wrap:wrap;gap:4px}
    .wp{padding:5px 7px;border:1.5px solid var(--border);background:white;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;min-width:40px;text-align:center}
    .wp.on{border-color:var(--gold);background:var(--gold);color:var(--dark)}

    .prows{display:flex;flex-direction:column}
    .prow2{padding:10px 0;border-bottom:1px solid #f3ede0}
    .prow2:last-child{border-bottom:none}
    .prow2.ib{background:rgba(26,107,60,0.03);border-radius:7px;padding:10px 5px}
    .ptop{display:flex;align-items:center;gap:10px}
    .pinfo{flex:1}
    .pname{font-weight:600;font-size:14px;display:block}
    .btag{font-size:10px;letter-spacing:1.5px;color:var(--green);font-weight:700;margin-top:1px;display:block}
    .wtag{font-size:11px;color:var(--gold);font-weight:600;margin-top:1px;display:block}
    .iarea{display:flex;align-items:center;gap:8px}
    .sbadge{font-size:11px;font-weight:700;background:#fef3c7;color:#d97706;border-radius:5px;padding:2px 5px}
    .sinp{width:56px;height:46px;text-align:center;border:2px solid var(--border);border-radius:9px;font-size:22px;font-weight:700;font-family:'Bebas Neue',sans-serif;color:var(--dark);background:var(--cream);-webkit-appearance:none}
    .sinp:focus{outline:none;border-color:var(--green)}
    .sinp:disabled{opacity:0.55;background:#eee}
    .nbadge{font-size:12px;font-weight:700;background:#ede9fe;color:#7c3aed;border-radius:5px;padding:2px 6px}
    .rchip{font-size:13px;font-weight:700;padding:5px 9px;border-radius:7px;min-width:50px;text-align:center}
    .rchip.win{background:#dcfce7;color:var(--win)}
    .rchip.loss{background:#fee2e2;color:var(--loss)}
    .rchip.push{background:#f3f4f6;color:var(--muted)}

    .pressrow{display:flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap}
    .presslbl{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted)}
    .prbtn{padding:4px 10px;border-radius:18px;border:1.5px solid var(--border);background:white;font-size:11px;font-weight:700;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif}
    .prbtn.p2{border-color:#f97316;background:#f97316;color:white}
    .prbtn.p3{border-color:#dc2626;background:#dc2626;color:white}
    .prbtn.pb2{border-color:#7c3aed;background:#7c3aed;color:white}
    .fbet{font-size:12px;font-weight:700;background:#f0e8d8;border-radius:7px;padding:3px 8px;margin-left:auto}

    .hfoot{padding:12px 16px}
    .lbtn{width:100%;padding:13px;background:var(--green);color:white;border:none;border-radius:9px;font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1.5px;cursor:pointer}
    .lbtn:disabled{opacity:0.35;font-size:13px;letter-spacing:0.5px;font-family:'DM Sans',sans-serif;font-weight:600}
    .ubtn{width:100%;padding:10px;background:transparent;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif}

    .smtitle{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--gold);letter-spacing:4px;flex-shrink:0}
    .suicons{display:flex;align-items:center;gap:2px}
    .sutbl{width:100%;border-collapse:collapse;margin-top:10px}
    .sutbl th{font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,0.45);padding:0 4px 6px;text-align:right}
    .sutbl th.l{text-align:left}
    .sutbl td{padding:9px 4px;border-top:1px solid rgba(255,255,255,0.08);text-align:right;font-size:13px;color:rgba(255,255,255,0.75);white-space:nowrap}
    .sutbl td.surk{font-family:'Bebas Neue',sans-serif;font-size:22px;color:rgba(255,255,255,0.35);text-align:left;width:22px}
    .sutbl td.surk.g{color:var(--gold)}
    .sutbl td.sunm{text-align:left;font-weight:600;font-size:15px;color:var(--cream);white-space:normal}
    .sutbl td.sutot{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:0.5px;color:var(--cream)}
    .sutbl .pos{color:#4ade80}.sutbl .neg{color:#f87171}
    .smscore{width:100%;max-width:440px;background:var(--cream);border-radius:14px;overflow:hidden;flex-shrink:0}
    .sctbl{width:100%;border-collapse:collapse;font-size:12px}
    .sctbl th{font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;font-weight:700;padding:8px 6px;text-align:center;border-bottom:1.5px solid var(--border)}
    .sctbl th:first-child{text-align:left}
    .sctbl td{padding:8px 6px;text-align:center;border-bottom:1px solid #f0e8d8;font-weight:600}
    .sctbl tr:last-child td{border-bottom:none}
    .sctbl td:first-child{text-align:left;font-weight:700}
    .sctbl td.scnet{color:var(--green);font-weight:700}
    .smlog{width:100%;max-width:440px;flex-shrink:0}
    .smstats{width:100%;max-width:440px;background:rgba(255,255,255,0.06);border-radius:14px;padding:6px 16px;flex-shrink:0}
    .stt{font-family:'Bebas Neue',sans-serif;color:rgba(255,255,255,0.45);font-size:15px;letter-spacing:2px;text-align:center;padding:10px 0 6px}
    .strow{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.08)}
    .strow:last-child{border-bottom:none}
    .stl{font-size:11px;color:rgba(255,255,255,0.45);flex:1;line-height:1.4}
    .stv{text-align:right;flex-shrink:0}
    .stvn{font-weight:600;font-size:14px;color:white;display:block}
    .stvs{font-size:11px;color:var(--goldk);display:block;margin-top:1px}
    .logt{font-family:'Bebas Neue',sans-serif;color:rgba(255,255,255,0.4);font-size:15px;letter-spacing:2px;text-align:center;margin-bottom:6px}
    .logr{background:rgba(255,255,255,0.06);border-radius:9px;padding:9px 12px;margin-bottom:5px}
    .logrh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
    .lrh{font-family:'Bebas Neue',sans-serif;color:var(--gold);font-size:17px;min-width:32px}
    .lrb{font-size:11px;color:rgba(255,255,255,0.4)}
    .lrl{font-size:11px;color:rgba(255,255,255,0.25);margin-left:auto}
    .lrres{display:flex;gap:6px;flex-wrap:wrap}
    .lrc{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px}
    .lrc.pos{background:rgba(22,163,74,0.2);color:#4ade80}
    .lrc.neg{background:rgba(220,38,38,0.2);color:#f87171}
    .lrc.zero{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.35)}
    .smbrow{display:flex;gap:10px;flex-shrink:0}
    .smbtn{padding:13px 28px;background:var(--gold);color:var(--dark);border:none;border-radius:12px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer}
    .mback{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;padding:20px}
    .mback.on{display:flex}
    .mbox{background:#14281a;border:1px solid rgba(201,168,76,0.4);border-radius:16px;padding:22px 20px;max-width:340px;width:100%;color:#f7f3ea}
    .mtitle{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--gold);margin-bottom:8px}
    .mbody{font-size:14px;line-height:1.45;color:rgba(255,255,255,0.8);margin-bottom:18px}
    .mbtns{display:flex;gap:10px}
    .mbtns button{flex:1;padding:12px 8px;border-radius:10px;border:1px solid rgba(255,255,255,0.25);background:transparent;color:#f7f3ea;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;cursor:pointer}
    .mbtns button.mok{background:var(--gold);color:var(--dark);border-color:var(--gold)}
    .mbtns button.mdanger{background:#b91c1c;border-color:#b91c1c;color:#fff}

    /* ---- Hammer: setup ---- */
    .hmtoggle{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;border:2px solid var(--border);border-radius:14px;background:white;cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif}
    .hmtoggle.on{border-color:var(--gold);background:var(--dark)}
    .hmtoggle:disabled{opacity:0.45;cursor:default}
    .hmtoggle.lk{pointer-events:none}
    .hmtxt{flex:1;display:flex;flex-direction:column}
    .hmname{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:var(--dark);line-height:1}
    .hmtoggle.on .hmname{color:var(--gold)}
    .hmsub{font-size:12px;color:var(--muted);margin-top:2px}
    .hmtoggle.on .hmsub{color:rgba(255,255,255,0.7)}
    .hmsw{width:44px;height:26px;border-radius:13px;background:#d1d5db;position:relative;flex-shrink:0;transition:background .15s}
    .hmsw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:white;transition:left .15s}
    .hmtoggle.on .hmsw{background:var(--gold)}
    .hmtoggle.on .hmsw::after{left:21px}
    .hmopts{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
    .hmopts .hi{width:80px}
    .prow.tm{border-left:2px solid var(--tc);border-right:2px solid var(--tc);padding:0 8px 6px;margin-bottom:0}
    .prow.tm.t0{--tc:var(--gold)}
    .prow.tm.t1{--tc:var(--green2)}
    .prow.tmtop{border-top:2px solid var(--tc);border-radius:12px 12px 0 0;padding-top:22px;position:relative}
    .prow.tmtop::before{content:attr(data-teamlbl);position:absolute;top:4px;left:10px;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--tc)}
    .prow.tmbot{border-bottom:2px solid var(--tc);border-radius:0 0 12px 12px;padding-bottom:8px;margin-bottom:10px}
    .prow.tmtop.tmbot{border-radius:12px}
    .prow.tmpad{padding:0 10px}

    /* ---- Hammer: game ---- */
    .hmbar{margin:5px 12px;background:var(--dark);border-radius:14px;border:1.5px solid var(--gold);color:var(--cream);overflow:hidden}
    .hmhdr{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(201,168,76,0.12)}
    .hmttl{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:2px;color:var(--gold);line-height:1}
    .hmval{margin-left:auto;font-weight:700;font-size:13px;color:var(--goldk);text-align:right;white-space:nowrap}
    .hmteams{display:flex;gap:6px;padding:8px 12px 0}
    .hmteam{flex:1;min-width:0;border:2px solid var(--tc);border-radius:10px;padding:7px 9px;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:6px}
    .t0{--tc:var(--gold)}
    .t1{--tc:#4ade80}
    .hmtm{font-weight:700;line-height:1.2;min-width:0;overflow-wrap:anywhere}
    .hmbtn.hmthrow{padding:7px 6px;display:flex;align-items:center;justify-content:center}
    .hmbtn.hmpbtn{padding:5px 8px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:left}
    .hmpw{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;line-height:1}
    .lbinc{border:1.5px solid rgba(255,255,255,0.35);background:transparent;color:rgba(255,255,255,0.8);font-family:'DM Sans',sans-serif;font-weight:600;font-size:11px;padding:4px 9px;border-radius:14px;cursor:pointer}
    .lbinc.on{background:var(--gold);border-color:var(--gold);color:var(--dark)}
    .hmtt{font-weight:700;font-size:16px;flex-shrink:0}
    .hmtt.pos{color:#4ade80}.hmtt.neg{color:#f87171}
    .hmbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
    .hmbtns{display:flex;gap:8px}
    .hmbtn{flex:1;padding:11px 6px;border-radius:10px;border:2px solid var(--tc,rgba(255,255,255,0.3));background:transparent;color:var(--cream);font-weight:700;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;line-height:1.25}
    .hmbtn:disabled{opacity:0.3;cursor:default}
    .hmbtn small{display:block;font-weight:500;font-size:11px;opacity:0.8}
    .hmbtn.hmacc{background:var(--win);border-color:var(--win);color:white}
    .hmbtn.hmdec{background:var(--loss);border-color:var(--loss);color:white}
    .hmalert{border:2px solid var(--gold);border-radius:12px;padding:10px;background:rgba(201,168,76,0.15);display:flex;flex-direction:column;gap:8px}
    .hmalert b{color:var(--gold)}
    .hmline{font-size:12px;color:rgba(255,255,255,0.75);line-height:1.45}
    .hmline b{color:var(--cream)}
    .hmrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .hmtag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,0.1);color:var(--goldk)}
    .hmundo{padding:5px 11px;border-radius:16px;border:1px solid rgba(255,255,255,0.35);background:transparent;color:var(--goldk);font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
    .hmpress{border-top:1px solid rgba(255,255,255,0.1);padding-top:8px}
    .lbhr{display:flex;align-items:center;gap:8px}
    .lbsplit{display:block;font-size:10px;color:var(--muted);font-weight:500}
    .hmsm{width:100%;max-width:440px;background:var(--dark);border:1.5px solid var(--gold);border-radius:14px;padding:12px 16px;color:var(--cream);flex-shrink:0}
  </style>
</head>
<body>

<div id="modal" class="mback" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="mbox">
    <div class="mtitle" id="mtitle"></div>
    <div class="mbody" id="mbody"></div>
    <div class="mbtns"><button id="mcancel"></button><button id="mok"></button></div>
  </div>
</div>

<div id="setup" class="screen active">
  <div><div class="logo-i">⛳</div><div class="logo-t" style="font-size:38px;letter-spacing:3px">ROLLING GREEN BANKER</div></div>
  <div class="card">
    <div class="editnote" id="editnote" style="display:none"></div>
    <div class="editsettled" id="editsettled" style="display:none"></div>
    <div>
      <label class="flbl">Course</label>
      <div class="coursebtn" id="coursepills">
        <button class="coursebtn-half on" data-course="home"><img class="courselogo" src="rg.png" alt="Rolling Green CC"></button>
        <button class="coursebtn-half" data-course="away">Away</button>
      </div>
    </div>
    <div id="teesection">
      <label class="flbl">Tees</label>
      <div class="cpills" id="teepills">
        <button class="cpill on" data-tee="white">White</button>
        <button class="cpill" data-tee="blue">Blue</button>
      </div>
      <div id="teeinfo" style="font-size:12px;color:var(--muted);margin-top:6px;text-align:center"></div>
    </div>
    <div id="awaysection" style="display:none">
      <label class="flbl">Rating &amp; Slope</label>
      <div class="prow">
        <input type="number" step="0.1" class="ni" id="awayrating" placeholder="Rating">
        <input type="number" step="1" class="ni" id="awayslope" placeholder="Slope">
      </div>
      <label class="flbl" style="margin-top:10px">Stroke Index (hole 1–18)</label>
      <div class="sigrid" id="sigrid"></div>
      <div id="sigridmsg" class="sigridmsg"></div>
    </div>
    <div id="pcsection" style="text-align:center">
      <label class="flbl" style="text-align:center">Number of Players</label>
      <div style="display:flex;align-items:center;justify-content:center;gap:10px">
        <button type="button" class="pmbtn" id="pcminus">−</button>
        <input type="number" class="hi" id="playercount" min="2" max="6" step="1" value="4">
        <button type="button" class="pmbtn" id="pcplus">+</button>
      </div>
    </div>
    <div id="hmsection">
      <button type="button" class="hmtoggle" id="hmtoggle" aria-pressed="false">
        <span id="hmicon"></span>
        <span class="hmtxt"><span class="hmname">Hammer</span><span class="hmsub" id="hmsub"></span></span>
        <span class="hmsw"></span>
      </button>
      <div class="hmopts" id="hmopts" style="display:none">
        <span>Base bet</span><span style="font-weight:700;color:var(--txt)">$</span>
        <input type="number" class="hi" id="hmbase" min="1" step="1" inputmode="numeric" value="20">
        <span>per man, per hole</span>
      </div>
    </div>
    <div>
      <div class="prow" id="rowhdr" style="margin-bottom:2px">
        <span class="flbl" id="nameshdr" style="flex:1;margin-bottom:0">Player Names</span>
        <span class="flbl" style="width:72px;flex-shrink:0;margin-bottom:0;text-align:center">Index</span>
        <span class="flbl" style="width:46px;flex-shrink:0;margin-bottom:0;text-align:center">Hcp</span>
        <span class="flbl" style="width:46px;flex-shrink:0;margin-bottom:0;text-align:center">Net</span>
        <span class="flbl" id="rowbtnhdr" style="width:46px;flex-shrink:0;margin-bottom:0;display:none;text-align:center;letter-spacing:0.5px;line-height:1.2">In play</span>
      </div>
      <div id="ninputs"></div>
      <div id="inhint" class="inhint" style="display:none">Uncheck to remove a player — they keep every hole they have already played.</div>
      <div id="namesmsg" class="sigridmsg"></div>
      <div id="editmsg" class="sigridmsg"></div>
      <button type="button" class="addp" id="addplayer" style="display:none">+ Add Player</button>
    </div>
    <button class="teeup" id="teeup" disabled>Tee It Up →</button>
    <button type="button" class="cancelsetup" id="cancelsetup" style="display:none">Cancel — back to the round</button>
  </div>
</div>

<div id="game" class="screen">
  <div class="topbar">
    <span class="gtitle">⛳ BANKER</span>
    <div class="topbtns">
      <button class="setupbtn" id="editbtn">Setup</button>
      <button class="sumbtn" id="sumbtn">Summary</button>
    </div>
  </div>
  <div class="gscroll">
    <div id="lb"></div>
    <div class="hnav" id="hnav"></div>
    <div id="hmbar"></div>
    <div id="hcard"></div>
  </div>
</div>

<div id="summary" class="screen">
  <div class="smtitle">Round Summary</div>
  <div id="smcard" class="hmsm"></div>
  <div id="smscore" class="smscore"></div>
  <div id="smstats" class="smstats"></div>
  <div id="smlog" class="smlog"></div>
  <div class="smbrow">
    <button class="smbtn" id="backbtn">← Back</button>
    <button class="smbtn" id="newbtn">New Game</button>
  </div>
</div>

<script src="banker-logic.js"></script>
<script>
function activeTee(){
  if(G.course==='away'){
    var r=parseFloat(document.getElementById('awayrating').value),
        s=parseFloat(document.getElementById('awayslope').value);
    return {rating:isNaN(r)?COURSE.rating:r, slope:isNaN(s)?COURSE.slope:s};
  }
  return TEES[G.tee];
}

function renderCourseUI(){
  var btns=document.querySelectorAll('#coursepills .coursebtn-half');
  for(var i=0;i<btns.length;i++) btns[i].classList.toggle('on',btns[i].dataset.course===G.course);
  document.getElementById('teesection').style.display=G.course==='away'?'none':'block';
  document.getElementById('awaysection').style.display=G.course==='away'?'block':'none';
  renderTeeInfo();
}

function renderTeeInfo(){
  var btns=document.querySelectorAll('#teepills .cpill');
  for(var i=0;i<btns.length;i++) btns[i].classList.toggle('on',btns[i].dataset.tee===G.tee);
  var t=TEES[G.tee];
  document.getElementById('teeinfo').textContent='Rating '+t.rating+' · Slope '+t.slope;
}

function updateLiveHandicaps(){
  var rows=document.querySelectorAll('#ninputs .prow');
  var tee=activeTee();
  var idx=[],validIdx=[],validPos=[];
  for(var i=0;i<rows.length;i++){
    var v=parseFloat(rows[i].querySelector('.hi').value);
    idx.push(isNaN(v)?null:v);
    if(!isNaN(v)){validIdx.push(v);validPos.push(i);}
  }
  // Netting over every row on screen, players marked out included — which is
  // exactly the reference the remaining holes will be dotted against.
  var net=validIdx.length?netHandicaps(validIdx,tee):[];
  for(var i=0;i<rows.length;i++){
    var hcpres=rows[i].querySelector('.hcpres'),netres=rows[i].querySelector('.netres');
    var pos=validPos.indexOf(i);
    if(pos===-1){hcpres.textContent='';netres.textContent='';continue;}
    hcpres.textContent=courseHdcp(idx[i],tee);
    netres.textContent=fmtNet(net[pos]);
  }
}

function fmtNet(n){
  return n===0?'0':(n>0?'+'+n:String(n));
}

function buildSIInputs(){
  var c=document.getElementById('sigrid');
  c.innerHTML='';
  for(var i=0;i<HOLES;i++){
    var cell=document.createElement('div');
    cell.className='sicell';
    var lbl=document.createElement('span');
    lbl.className='sih'; lbl.textContent='H'+(i+1);
    var inp=document.createElement('input');
    inp.type='number'; inp.className='siinp'; inp.min='1'; inp.max='18'; inp.step='1';
    inp.inputMode='numeric'; inp.dataset.hi=i;
    inp.addEventListener('input',function(){renderSIStatus();chkValid();});
    cell.appendChild(lbl); cell.appendChild(inp);
    c.appendChild(cell);
  }
}

function collectAwaySI(){
  var inputs=document.querySelectorAll('#sigrid .siinp');
  var arr=[];
  for(var i=0;i<inputs.length;i++){
    var v=parseInt(inputs[i].value,10);
    arr.push(isNaN(v)?null:v);
  }
  return arr;
}

// Live per-box validation: flags out-of-range or duplicate SI values as soon
// as they're typed, not just once all 18 boxes are filled.
function renderSIStatus(){
  var msg=document.getElementById('sigridmsg');
  var inputs=document.querySelectorAll('#sigrid .siinp');
  var si=collectAwaySI();
  var counts={};
  for(var i=0;i<si.length;i++) if(si[i]!=null) counts[si[i]]=(counts[si[i]]||0)+1;
  var anyBad=false;
  for(var i=0;i<inputs.length;i++){
    var v=si[i];
    var bad=v!=null&&(v<1||v>18||counts[v]>1);
    if(bad) anyBad=true;
    inputs[i].classList.toggle('bad',bad);
  }
  var filled=si.filter(function(v){return v!=null;}).length;
  var complete=filled===HOLES;
  var valid=complete&&!anyBad;
  if(anyBad){ msg.textContent='Fix the highlighted holes — stroke index must be 1–18 with no repeats.'; msg.className='sigridmsg bad'; }
  else if(!complete){ msg.textContent='Enter the stroke index (1–18) for every hole ('+filled+'/18 entered).'; msg.className='sigridmsg'; }
  else { msg.textContent='Valid stroke index sequence.'; msg.className='sigridmsg ok'; }
  return valid;
}

function setCount(n){
  G.count=n;
  buildInputs();
}

// Name/Index stay DOM-as-truth (chkValid, updateLiveHandicaps, startGame and
// saveSetupEdit all read them straight out of #ninputs). Mid-round each row
// also carries who it belongs to — data-player is the player's name as the
// game currently knows it, or '' for someone added in this edit — plus their
// data-hidden state.
function makeRow(i,name,index,player,hidden){
  var row=document.createElement('div');
  row.className='prow'+(hidden?' hid':'');
  row.dataset.player=player||'';
  row.dataset.hidden=hidden?'1':'0';
  var ni=document.createElement('input');
  ni.type='text'; ni.className='ni'; ni.placeholder='Player '+(i+1);
  ni.value=name; ni.autocomplete='off';
  ni.addEventListener('input',chkValid);
  var hi=document.createElement('input');
  hi.type='number'; hi.className='hi'; hi.placeholder='Index';
  hi.min='-10'; hi.max='45'; hi.step='0.1';
  hi.value=index;
  hi.addEventListener('input',function(){chkValid();updateLiveHandicaps();});
  var hcpres=document.createElement('span');
  hcpres.className='hres hcpres';
  var netres=document.createElement('span');
  netres.className='hres netres';
  row.appendChild(ni); row.appendChild(hi); row.appendChild(hcpres); row.appendChild(netres);
  if(editMode) row.appendChild(player?inPlayToggle(row):dropRowBtn(row));
  return row;
}

// A player already in the game is taken out by unchecking them, never removed
// — the holes they have played have to stay on the card. A checkbox rather
// than a button on purpose: a button reading "IN" is ambiguous about whether
// it is describing the current state or what tapping it will do.
function inPlayToggle(row){
  var lab=document.createElement('label');
  lab.className='inchk';
  lab.title='Checked = in play. Uncheck to take this player out for the rest of the round.';
  var cb=document.createElement('input');
  cb.type='checkbox';
  cb.checked=row.dataset.hidden!=='1';
  cb.addEventListener('change',function(){
    var hid=!cb.checked;
    row.dataset.hidden=hid?'1':'0';
    row.classList.toggle('hid',hid);
    chkValid();
  });
  lab.appendChild(cb);
  return lab;
}

// Someone added in this edit has no history yet, so their row can just go.
function dropRowBtn(row){
  var b=document.createElement('button');
  b.type='button'; b.className='rowbtn';
  b.title='Remove this new player';
  b.textContent='\u2715';
  b.addEventListener('click',function(){
    row.parentNode.removeChild(row);
    renumberRows(); chkValid(); updateLiveHandicaps();
  });
  return b;
}

function renumberRows(){
  var rows=document.querySelectorAll('#ninputs .prow');
  for(var i=0;i<rows.length;i++) rows[i].querySelector('.ni').placeholder='Player '+(i+1);
}

function buildInputs(){
  var c=document.getElementById('ninputs');
  var oldn=c.querySelectorAll('.ni'),oldh=c.querySelectorAll('.hi');
  var en=[],eh=[];
  for(var i=0;i<oldn.length;i++) en.push(oldn[i].value);
  for(var i=0;i<oldh.length;i++) eh.push(oldh[i].value);
  c.innerHTML='';
  for(var i=0;i<G.count;i++) c.appendChild(makeRow(i,en[i]||'',eh[i]||'',null,false));
  renderHammerSetup();
  chkValid();
  updateLiveHandicaps();
}

// Mid-round: one row per player already in the game, name and Index
// prefilled from G, with their current hidden state.
function buildEditInputs(){
  var c=document.getElementById('ninputs');
  c.innerHTML='';
  for(var i=0;i<G.players.length;i++){
    var p=G.players[i],ix=G.hdcp[p];
    c.appendChild(makeRow(i,p,ix==null?'':String(ix),p,isHiddenPlayer(p)));
  }
  G.count=G.players.length;
  document.getElementById('playercount').value=G.count;
  renderHammerSetup();
  chkValid();
  updateLiveHandicaps();
}

function chkValid(){
  var c=document.getElementById('ninputs');
  var ns=c.querySelectorAll('.ni'),hs=c.querySelectorAll('.hi');
  var ok=true;
  for(var i=0;i<ns.length;i++) if(!ns[i].value.trim()) ok=false;
  for(var i=0;i<hs.length;i++) if(hs[i].value==='') ok=false;
  if(!checkDuplicateNames(ns)) ok=false;
  if(G.course==='away'){
    var ar=document.getElementById('awayrating').value,as=document.getElementById('awayslope').value;
    if(ar===''||as==='') ok=false;
    if(!isValidSISequence(collectAwaySI())) ok=false;
  }
  if(editMode&&!chkEditRows()) ok=false;
  if(!editMode&&hammerWanted()&&!(parseInt(document.getElementById('hmbase').value,10)>0)) ok=false;
  document.getElementById('teeup').disabled=!ok;
}

// The two rules that only exist mid-round: at least two players must still be
// in play (marking everyone out leaves no bet to make on the holes that are
// left), and the setup stepper's 6-player ceiling still applies to late
// arrivals. The ceiling counts players IN PLAY, not rows — a round where two
// players left and two others joined is a legitimate six-player card.
function chkEditRows(){
  var rows=document.querySelectorAll('#ninputs .prow');
  var playing=0;
  for(var i=0;i<rows.length;i++) if(rows[i].dataset.hidden!=='1') playing++;
  var msg=document.getElementById('editmsg'),txt='';
  if(playing<2) txt='At least two players must still be in play.';
  else if(playing>6) txt='Six players in play maximum.';
  msg.textContent=txt;
  msg.className=txt?'sigridmsg bad':'sigridmsg';
  document.getElementById('addplayer').disabled=playing>=6;
  return !txt;
}

// Live duplicate-name check (case/whitespace-insensitive, blanks ignored).
// Player names are used as object keys throughout G (wagers/press/strokes/
// chdcp), so duplicates would silently merge two players into one.
function checkDuplicateNames(ns){
  var counts={};
  for(var i=0;i<ns.length;i++){
    var v=ns[i].value.trim().toLowerCase();
    if(!v) continue;
    counts[v]=(counts[v]||0)+1;
  }
  var anyDup=false;
  for(var i=0;i<ns.length;i++){
    var v=ns[i].value.trim().toLowerCase();
    var dup=!!v&&counts[v]>1;
    if(dup) anyDup=true;
    ns[i].classList.toggle('bad',dup);
  }
  var msg=document.getElementById('namesmsg');
  if(msg) msg.textContent=anyDup?'Player names must be unique.':'';
  msg.className=anyDup?'sigridmsg bad':'sigridmsg';
  return !anyDup;
}

function startGame(){
  var ns=document.querySelectorAll('#ninputs .ni'),hs=document.querySelectorAll('#ninputs .hi');
  var tee=activeTee();
  G.players=[];
  var idx=[];
  for(var i=0;i<ns.length;i++){
    G.players.push(ns[i].value.trim());
    idx.push(parseFloat(hs[i].value)||0);
  }
  G.awayHoles=G.course==='away'?buildAwayHoles(collectAwaySI()):null;
  applyHandicaps(G.players,idx,tee);
  G.roster=initRoster(G.players);
  G.holes=initHoles(G.players); G.active=0;
  G.hammer=hammerWanted()?initHammer(G.players,parseInt(document.getElementById('hmbase').value,10)):null;
  gameLive=true;
  showScreen('game'); renderGame();
}

// ---------------------------------------------------------------------------
// Mid-round setup editing
//
// The same setup screen, reopened from the game's "Setup" button. Everything
// is editable except the Home/Away course toggle, and nothing is committed to
// G until Save — Cancel restores the tee/rating/slope/SI the round started
// with (those inputs mutate G.tee or are read straight off the DOM, so they
// have to be snapshotted to make Cancel truly non-destructive).
// ---------------------------------------------------------------------------

var editMode=false,editSnap=null;

function openSetupEdit(){
  editMode=true;
  editSnap={tee:G.tee,
            rating:document.getElementById('awayrating').value,
            slope:document.getElementById('awayslope').value,
            si:collectAwaySI()};
  renderEditChrome();
  buildEditInputs();
  renderCourseUI();
  renderSIStatus();
  chkValid();
  showScreen('setup');
}

function exitEditMode(){
  editMode=false; editSnap=null;
  renderEditChrome();
  renderCourseUI();
}

function renderEditChrome(){
  var on=editMode,at=on?nextUnplayedHole():0;
  document.getElementById('pcsection').style.display=on?'none':'block';
  document.getElementById('addplayer').style.display=on?'block':'none';
  document.getElementById('cancelsetup').style.display=on?'block':'none';
  document.getElementById('rowbtnhdr').style.display=on?'block':'none';
  document.getElementById('inhint').style.display=on?'block':'none';
  document.getElementById('coursepills').classList.toggle('lk',on);
  document.getElementById('teeup').textContent=on?'Save & Return →':'Tee It Up →';
  document.getElementById('nameshdr').textContent=on?'Players':'Player Names';
  renderHammerSetup();
  var note=document.getElementById('editnote'),settled=document.getElementById('editsettled');
  note.style.display=on?'block':'none';
  settled.style.display=on?'block':'none';
  if(!on){ note.textContent=''; settled.innerHTML=''; document.getElementById('editmsg').textContent=''; return; }
  renderSettled(settled,at);
  note.innerHTML='<b>Round in progress.</b> Course stays '+(G.course==='away'?'Away':'Rolling Green')+
    '. '+(at>=HOLES
      ? 'All 18 holes are locked, so added or hidden players change nothing from here.'
      : 'Players added or marked out take effect from hole '+(at+1)+' on — '+
        (at===1?'hole 1 keeps':'holes 1–'+at+' keep')+' exactly what was recorded.')+
    ' A player joining off a lower handicap than anyone playing re-dots the holes still '+
    'to play, as if the whole group had teed off together. Editing an Index or the tee is '+
    'the only thing that reaches back into holes already locked.';
}

// The money already agreed on locked holes, shown before the user changes
// anything so they can check it against the card in their pocket. The save
// then verifies these same numbers come back untouched.
function renderSettled(el,at){
  if(at<=0){ el.innerHTML='<b>Nothing settled yet</b> — no holes have been locked.'; return; }
  var t=calcTotals();
  var h='<b>Settled through hole '+at+'</b><br>';
  h+=G.players.map(function(p){
    var v=t[p];
    return p+' <span style="font-weight:700;color:'+(v>0?'var(--win)':v<0?'var(--loss)':'var(--muted)')+'">'+fmt(v)+'</span>';
  }).join(' &nbsp;·&nbsp; ');
  h+='<br><span style="color:var(--muted)">Adding or marking out a player will not move these. '+
     'The Net column below is for the holes still to play.</span>';
  el.innerHTML=h;
}

function saveSetupEdit(){
  var rows=document.querySelectorAll('#ninputs .prow');
  var at=nextUnplayedHole();
  var snap=snapshotGame();
  var renamed={},added=[],idxByName={},hiddenByName={};
  for(var i=0;i<rows.length;i++){
    var r=rows[i],nm=r.querySelector('.ni').value.trim(),ix=parseFloat(r.querySelector('.hi').value)||0;
    if(r.dataset.player) renamed[r.dataset.player]=nm; else added.push(nm);
    idxByName[nm]=ix;
    hiddenByName[nm]=r.dataset.hidden==='1';
  }

  // Renames first — everything below this point is keyed by player name. A
  // rename only moves keys, never money, so the settled baseline is taken
  // after it, by which point it lines up with the names used below.
  renamePlayers(G.players.map(function(p){return renamed[p]!==undefined?renamed[p]:p;}));
  var beforeTotals=calcTotals(),beforeRaw=JSON.parse(JSON.stringify(G.raw));

  for(var i=0;i<added.length;i++) addPlayerToGame(added[i],at);

  for(var i=0;i<G.players.length;i++){
    var p=G.players[i],want=!!hiddenByName[p];
    if(want!==isHiddenPlayer(p)) setPlayerHidden(p,want,at);
  }

  // Netting is per hole and derived (see chdcpAt), so this only has to refresh
  // the raw course handicaps. Holes already settled keep the reference they
  // were played under; the holes still to play pick up the new one.
  var idx=G.players.map(function(p){
    return idxByName[p]!==undefined?idxByName[p]:(G.hdcp[p]||0);
  });
  if(G.course==='away') G.awayHoles=buildAwayHoles(collectAwaySI());
  applyHandicaps(G.players,idx,activeTee());
  applyRoster();

  // Settled holes must not have moved. If no handicap was edited then this was
  // a pure join/departure, and any change to the running totals is a bug —
  // roll the whole save back rather than rewrite money already paid out.
  if(changedHandicaps(beforeRaw,G.raw).length===0&&!totalsUnchanged(beforeTotals,calcTotals())){
    restoreGame(snap);
    buildEditInputs();
    renderEditChrome();
    var msg=document.getElementById('editmsg');
    msg.textContent='Save cancelled — that change would have altered the money already settled on locked holes. Nothing was changed.';
    msg.className='sigridmsg bad';
    return;
  }

  exitEditMode();
  showScreen('game'); renderGame();
}

function cancelSetupEdit(){
  var snap=editSnap;
  if(snap){
    G.tee=snap.tee;
    document.getElementById('awayrating').value=snap.rating;
    document.getElementById('awayslope').value=snap.slope;
    var inputs=document.querySelectorAll('#sigrid .siinp');
    for(var i=0;i<inputs.length;i++) inputs[i].value=snap.si[i]==null?'':snap.si[i];
  }
  exitEditMode();
  renderTeeInfo(); renderSIStatus();
  showScreen('game'); renderGame();
}

function showScreen(id){
  var ids=['setup','game','summary'];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    el.classList.toggle('active',ids[i]===id);
  }
}

function renderGame(){renderLB();renderNav();renderHammer();renderCard();saveRound();}

// The leaderboard is the Banker game. A Hammer round gets a "Tap to Include Hammer" toggle
// that folds the Hammer money in, for the one number each player walks away
// with.
var lbMode='banker';

function lbRow(rank,name,meta,v,lead){
  return '<div class="lbr'+(lead?' lead':'')+'"><span class="lbp">'+rank+'</span>'+
    '<span class="lbn">'+name+' '+meta+'</span>'+
    '<span class="lba'+(v>0?' pos':v<0?' neg':'')+'">'+fmt(v)+'</span></div>';
}

function renderLB(){
  var t=calcTotals();
  var hp=G.holes.filter(function(h){return h.locked;}).length;
  var h='<div class="lb"><div class="lbh"><span class="lbt">LEADERBOARD</span><span class="lbhr">';
  if(G.hammer){
    var inc=lbMode==='combined';
    h+='<button class="lbinc'+(inc?' on':'')+'" id="lbinc" data-action="lbmode" data-v="'+(inc?'banker':'combined')+
      '" aria-pressed="'+inc+'">'+(inc?'✓ Hammer Included':'Tap to Include Hammer')+'</button>';
  }
  h+='<span class="lbs">'+hp+'/18</span></span></div>';

  function meta(p){
    return '<span style="font-size:10px;color:var(--muted)">CH'+(G.chdcp[p]||0)+(isHiddenPlayer(p)?' · OUT':'')+'</span>';
  }

  if(G.hammer&&lbMode==='combined'){
    var ht=hammerTotals(),c={};
    for(var i=0;i<G.players.length;i++){var p=G.players[i];c[p]=t[p]+(ht[p]||0);}
    var cs=G.players.slice().sort(function(a,b){return c[b]-c[a];});
    for(var i=0;i<cs.length;i++){
      var p=cs[i];
      h+=lbRow(i+1,p,meta(p)+'<span class="lbsplit">Banker '+fmt(t[p])+
        (hammerTeamOf(p)>=0?' · Hammer '+fmt(ht[p]):' · no Hammer')+'</span>',c[p],i===0&&c[p]>0);
    }
  } else {
    var sorted=G.players.slice().sort(function(a,b){return t[b]-t[a];});
    for(var i=0;i<sorted.length;i++) h+=lbRow(i+1,sorted[i],meta(sorted[i]),t[sorted[i]],i===0&&t[sorted[i]]>0);
  }
  h+='</div>';
  document.getElementById('lb').innerHTML=h;
}

function renderNav(){
  var h='';
  for(var i=0;i<G.holes.length;i++){
    var hole=G.holes[i];
    h+='<button class="hn'+(hole.locked?' done':'')+(i===G.active?' cur':'')+'" data-hi="'+i+'">'+(i+1)+'</button>';
  }
  document.getElementById('hnav').innerHTML=h;
}

function renderCard(){
  var hi=G.active,hole=G.holes[hi];
  var locked=hole.locked,result=locked?calcResult(hole):null;
  var bset=!!hole.banker,hd=activeHoles()[hi],pm=holeMult(hi);
  var vw=BETS.filter(function(v){return v>=hole.lmin&&v<=hole.lmax;});
  // Everything on this card is driven by who was actually in play for THIS
  // hole, not G.players — a late arrival isn't asked to wager on holes played
  // before they showed up, and a player who left stays on the holes they did.
  var inPlay=holePlayers(hi);
  var nonB=inPlay.filter(function(p){return p!==hole.banker;});
  var allW=bset&&nonB.every(function(p){return hole.wagers[p]!=null;});
  var allS=bset&&inPlay.every(function(p){return String(hole.strokes[p]).trim()!=='';});
  var hmWait=hammerPending(hi);
  var ready=allW&&allS&&!hmWait;
  var lockLbl=!bset?'Select Banker':!allW?'All Players Must Wager':!allS?'Enter All Scores':hmWait?'Answer the Hammer First':'Lock Hole '+hole.hole;

  var h='<div class="hcard'+(locked?' locked':'')+'"><div class="hhdr">';
  h+='<div><span class="hlbl">HOLE</span><span class="hnum">'+hole.hole+'</span></div>';
  h+='<div class="hinfo">PAR '+hd.par+'<br>SI '+hd.si+'</div>';
  h+='<div class="bbadge"><span>🏦</span><span class="bnm">'+(hole.banker||'—')+'</span></div></div>';

  if(inPlay.length<2){
    h+='<div class="hnote">Fewer than two players are in play on this hole.<br>Open <b>Setup</b> to add a player or put one back in.</div></div>';
    document.getElementById('hcard').innerHTML=h;
    return;
  }

  if(!locked){
    h+='<div class="sec"><span class="slbl">① WHO\'S THE BANKER?</span><div class="bpills">';
    for(var i=0;i<inPlay.length;i++){
      var p=inPlay[i];
      h+='<button class="bpill'+(hole.banker===p?' on':'')+'" data-action="banker" data-p="'+p+'">'+p+'</button>';
    }
    h+='</div></div>';
  }

  if(bset&&!locked){
    h+='<div class="sec"><span class="slbl">② BANKER SETS LIMITS</span><div class="limrow">';
    h+='<div class="limf"><label class="liml">MIN</label><div class="lpills">';
    for(var i=0;i<BETS.length;i++){var v=BETS[i];if(v>hole.lmax)continue;h+='<button class="lp'+(hole.lmin===v?' on':'')+'" data-action="lmin" data-v="'+v+'">$'+v+'</button>';}
    h+='</div></div><div class="limdiv">to</div><div class="limf"><label class="liml">MAX</label><div class="lpills">';
    for(var i=0;i<BETS.length;i++){var v=BETS[i];if(v<hole.lmin)continue;h+='<button class="lp'+(hole.lmax===v?' on':'')+'" data-action="lmax" data-v="'+v+'">$'+v+'</button>';}
    h+='</div></div></div>';
    if(vw.length>0) h+='<div class="limsum">Allowed: '+vw.map(function(v){return'$'+v;}).join(', ')+' · Max ('+pm+'×+bank): $'+(hole.lmax*pm*pm)+'</div>';
    h+='</div>';
  }

  if(bset&&!locked){
    h+='<div class="sec"><span class="slbl">③ PLAYER WAGERS</span>';
    for(var i=0;i<nonB.length;i++){
      var p=nonB[i];
      h+='<div class="wrow"><span class="wnm">'+p+'</span><div class="wpills">';
      for(var j=0;j<vw.length;j++){var v=vw[j];h+='<button class="wp'+(hole.wagers[p]===v?' on':'')+'" data-action="wager" data-p="'+p+'" data-v="'+v+'">$'+v+'</button>';}
      h+='</div></div>';
    }
    h+='</div>';
  }

  if(bset){
    h+='<div class="sec"><span class="slbl">'+(locked?'SCORES & RESULTS':'④ SCORES & PRESS')+'</span><div class="prows">';
    for(var i=0;i<inPlay.length;i++){
      var p=inPlay[i],ib=p===hole.banker;
      var pr=hole.press[p]||{player:false,banker:false};
      var bw=hole.wagers[p];
      var fwv=bw!=null?finalWager(bw,pr,hi):null;
      var m=calcMult(pr,hi);
      var stk=getStrokes(p,hi),gross=Number(hole.strokes[p]),net=gross?gross-stk:null;
      var rv=result?(result[p]||0):null;
      var cc=rv>0?'win':rv<0?'loss':'push';

      h+='<div class="prow2'+(ib?' ib':'')+'"><div class="ptop"><div class="pinfo"><span class="pname">'+p+'</span>';
      if(ib) h+='<span class="btag">BANKER</span>';
      if(!ib&&bw!=null) h+='<span class="wtag">'+(m>1?'base $'+bw+' → $'+fwv:'$'+bw)+'</span>';
      h+='</div><div class="iarea">';
      if(stk>0) h+='<span class="sbadge">+'+stk+'</span>';
      h+='<input type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="15" class="sinp"'+(locked?' disabled':'')+' value="'+hole.strokes[p]+'" placeholder="—" data-action="score" data-p="'+p+'"/>';
      if(net&&stk>0) h+='<span class="nbadge">net '+net+'</span>';
      if(locked&&rv!==null) h+='<div class="rchip '+cc+'">'+fmt(rv)+'</div>';
      h+='</div></div>';

      if(ib&&!locked){
        var wagered=nonB.filter(function(pp){return hole.wagers[pp]!=null;});
        if(wagered.length>0){
          var allBanked=wagered.every(function(pp){return hole.press[pp].banker;});
          h+='<div class="pressrow"><span class="presslbl">PRESS:</span>';
          h+='<button class="prbtn'+(allBanked?' pb2':'')+'" data-action="bpressall">🏦 '+pm+'× Bank All</button>';
          h+='</div>';
        }
      }
      if(ib&&locked){
        var bankedCount=nonB.filter(function(pp){return hole.press[pp]&&hole.press[pp].banker;}).length;
        if(bankedCount>0) h+='<div class="pressrow"><span style="font-size:11px;color:var(--muted)">🏦 '+pm+'× bank pressed on '+bankedCount+' player'+(bankedCount===1?'':'s')+'</span></div>';
      }
      if(!ib&&!locked&&bw!=null){
        h+='<div class="pressrow"><span class="presslbl">PRESS:</span>';
        h+='<button class="prbtn'+(pr.player?(pm===3?' p3':' p2'):'')+'" data-action="press" data-p="'+p+'">'+pm+'× Press</button>';
        if(pr.banker) h+='<span class="prbtn pb2" style="cursor:default">🏦 '+pm+'× Bank</span>';
        if(fwv&&m>1) h+='<span class="fbet">$'+fwv+'</span>';
        h+='</div>';
      }
      if(!ib&&locked&&bw!=null){
        var pd=[];
        if(pr.player) pd.push(pm+'× pressed');
        if(pr.banker) pd.push('🏦 '+pm+'× bank');
        if(pd.length) h+='<div class="pressrow"><span style="font-size:11px;color:var(--muted)">'+pd.join(' + ')+' → $'+fwv+'</span></div>';
      }
      h+='</div>';
    }
    h+='</div></div>';
  }

  h+='<div class="hfoot">';
  h+=locked?'<button class="ubtn" data-action="unlock">✏️ Edit Hole</button>':'<button class="lbtn"'+(ready?'':' disabled')+' data-action="lock">'+lockLbl+'</button>';
  h+='</div></div>';
  document.getElementById('hcard').innerHTML=h;
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]'); if(!el) return;
  var a=el.dataset.action,p=el.dataset.p,v=el.dataset.v;
  var hole=G.holes[G.active];

  if(a==='banker'){
    hole.banker=p;
    for(var i=0;i<G.players.length;i++){hole.wagers[G.players[i]]=null;hole.press[G.players[i]]={player:false,banker:false};}
    renderGame();
  } else if(a==='lmin'){
    hole.lmin=Number(v); if(hole.lmax<hole.lmin) hole.lmax=hole.lmin;
    for(var i=0;i<G.players.length;i++){var pl=G.players[i];if(hole.wagers[pl]!=null&&(hole.wagers[pl]<hole.lmin||hole.wagers[pl]>hole.lmax)){hole.wagers[pl]=null;hole.press[pl]={player:false,banker:false};}}
    renderGame();
  } else if(a==='lmax'){
    hole.lmax=Number(v); if(hole.lmin>hole.lmax) hole.lmin=hole.lmax;
    for(var i=0;i<G.players.length;i++){var pl=G.players[i];if(hole.wagers[pl]!=null&&(hole.wagers[pl]<hole.lmin||hole.wagers[pl]>hole.lmax)){hole.wagers[pl]=null;hole.press[pl]={player:false,banker:false};}}
    renderGame();
  } else if(a==='wager'){
    hole.wagers[p]=Number(v); hole.press[p]={player:false,banker:false}; renderGame();
  } else if(a==='press'){
    hole.press[p].player=!hole.press[p].player; renderGame();
  } else if(a==='bpressall'){
    var nonBW=G.players.filter(function(pl){return pl!==hole.banker&&hole.wagers[pl]!=null;});
    var allOn=nonBW.length>0&&nonBW.every(function(pl){return hole.press[pl].banker;});
    for(var i=0;i<nonBW.length;i++) hole.press[nonBW[i]].banker=!allOn;
    renderGame();
  } else if(a==='lock'){
    hole.locked=true;
    if(G.active<HOLES-1) G.active++;
    renderGame();
    setTimeout(function(){var nav=document.getElementById('hnav');if(nav.children[G.active])nav.children[G.active].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});},100);
  } else if(a==='unlock'){
    hole.locked=false; renderGame();
  } else if(a==='lbmode'){
    lbMode=v; renderLB();
  } else if(a==='hthrow'){
    hammerThrow(G.active,Number(v)); renderGame();
  } else if(a==='haccept'||a==='hdecline'){
    hammerAnswer(G.active,a==='haccept'); renderGame();
  } else if(a==='hundo'){
    hammerUndo(G.active); renderGame();
  } else if(a==='hpress'){
    hammerPress(Number(v)); renderGame();
  } else if(a==='hunpress'){
    hammerUndoPress(); renderGame();
  }
});

document.getElementById('hnav').addEventListener('click',function(e){

function renderSummary(){
  var t=calcTotals();
  renderSettleUp(t);

  // ---- Scorecard: front/back/total gross strokes + net (total - handicap) ----
  var sc=calcScores();
  var scSorted=G.players.slice().sort(function(a,b){return sc.net[a]-sc.net[b];});
  // Net is through the locked holes only (see calcScores), so say how many.
  var thru=G.holes.filter(function(x){return x.locked;}).length;
  var sh0='<table class="sctbl"><tr><th>Player</th><th>Front</th><th>Back</th><th>Total</th><th>'+
    (thru?'Net Thru '+thru:'Net')+'</th></tr>';
  for(var i=0;i<scSorted.length;i++){
    var p=scSorted[i],played=sc.total[p]>0;
    sh0+='<tr><td>'+p+'</td><td>'+(played?sc.front[p]:'–')+'</td><td>'+(played?sc.back[p]:'–')+'</td><td>'+(played?sc.total[p]:'–')+'</td><td class="scnet">'+(played?sc.net[p]:'–')+'</td></tr>';
  }
  sh0+='</table>';
  document.getElementById('smscore').innerHTML=sh0;

  // ---- Betting stats ----
  var lh=G.holes.filter(function(x){return x.locked;});
  var totalBet={}, bankRisk={}, bankHoles={}, biggest={amt:0,who:null,hole:null}, topLimit={amt:0,who:null,hole:null}, anyBets=false;
  for(var i=0;i<G.players.length;i++){totalBet[G.players[i]]=0;bankRisk[G.players[i]]=0;bankHoles[G.players[i]]=0;}
  for(var i=0;i<lh.length;i++){
    var hole=lh[i], hi=hole.hole-1, holeExp=0;
    if(hole.lmax>topLimit.amt){topLimit={amt:hole.lmax,who:hole.banker,hole:hole.hole};}
    for(var j=0;j<G.players.length;j++){
      var p=G.players[j];
      if(p===hole.banker||hole.wagers[p]==null) continue;
      var fw=finalWager(hole.wagers[p],hole.press[p],hi);
      totalBet[p]+=fw; holeExp+=fw; anyBets=true;
      if(fw>biggest.amt){biggest={amt:fw,who:p,hole:hole.hole};}
    }
    if(hole.banker){bankRisk[hole.banker]+=holeExp;bankHoles[hole.banker]++;}
  }
  var sh='<div class="stt">BETTING STATS</div>';
  if(anyBets){
    var bigSpender=G.players.slice().sort(function(a,b){return totalBet[b]-totalBet[a];})[0];
    sh+='<div class="strow"><span class="stl">Most wagered<br>(total risked across the round)</span>'
      + '<span class="stv"><span class="stvn">'+bigSpender+'</span><span class="stvs">$'+totalBet[bigSpender]+'</span></span></div>';
    sh+='<div class="strow"><span class="stl">Biggest single bet<br>(after presses)</span>'
      + '<span class="stv"><span class="stvn">'+biggest.who+'</span><span class="stvs">$'+biggest.amt+' on hole '+biggest.hole+'</span></span></div>';
    sh+='<div class="strow"><span class="stl">Highest limit offered<br>(by the banker)</span>'
      + '<span class="stv"><span class="stvn">'+topLimit.who+'</span><span class="stvs">$'+topLimit.amt+' on hole '+topLimit.hole+'</span></span></div>';
    var bigBanker=G.players.slice().sort(function(a,b){return bankRisk[b]-bankRisk[a];})[0];
    sh+='<div class="strow"><span class="stl">Most risked as banker<br>(total covered across the round)</span>'
      + '<span class="stv"><span class="stvn">'+bigBanker+'</span><span class="stvs">$'+bankRisk[bigBanker]+' over '+bankHoles[bigBanker]+' hole'+(bankHoles[bigBanker]===1?'':'s')+'</span></span></div>';
    sh+='<div class="strow"><span class="stl">Total risked as banker</span><span class="stv">'
      + G.players.slice().sort(function(a,b){return bankRisk[b]-bankRisk[a];}).map(function(p){
          return '<span class="stvn" style="font-weight:500;font-size:13px">'+p+' &nbsp;<span style="color:var(--goldk)">$'+bankRisk[p]+'</span></span>';
        }).join('')
      + '</span></div>';
    sh+='<div class="strow"><span class="stl">Total wagered by player</span><span class="stv">'
      + G.players.slice().sort(function(a,b){return totalBet[b]-totalBet[a];}).map(function(p){
          return '<span class="stvn" style="font-weight:500;font-size:13px">'+p+' &nbsp;<span style="color:var(--goldk)">$'+totalBet[p]+'</span></span>';
        }).join('')
      + '</span></div>';
  } else {
    sh+='<div class="strow"><span class="stl">No holes locked yet.</span></div>';
  }
  document.getElementById('smstats').innerHTML=sh;

  // ---- Hole by hole ----
  var lh2='<div class="logt">HOLE BY HOLE</div>';
  for(var i=0;i<lh.length;i++){
    var hole=lh[i],r=calcResult(hole);
    lh2+='<div class="logr"><div class="logrh"><span class="lrh">H'+hole.hole+'</span><span class="lrb">🏦 '+hole.banker+'</span><span class="lrl">$'+hole.lmin+'-$'+hole.lmax+'</span></div><div class="lrres">';
    var hp=holePlayers(hole.hole-1);
    for(var j=0;j<hp.length;j++){var p=hp[j],v=r?(r[p]||0):0;lh2+='<span class="lrc '+(v>0?'pos':v<0?'neg':'zero')+'">'+p+': '+fmt(v)+'</span>';}
    lh2+='</div>';
    if(G.hammer){
      var hr=hammerHole(hole.hole-1);
      if(hr) lh2+='<div class="lrres" style="margin-top:5px"><span class="lrc '+(hr.win<0?'zero':'pos')+'">🔨 '+hammerOutcomeText(hr)+'</span></div>';
    }
    lh2+='</div>';
  }
  document.getElementById('smlog').innerHTML=lh2;
}

// ---------------------------------------------------------------------------
// Hammer UI
//
// Setup: an opt-in toggle (even player counts only) and a base bet. While it
// is on, the player rows are boxed into Team 1 (top half) and Team 2 (bottom
// half) so the scorer can see the teams form as they type names. Mid-round
// it is read-only, like the course toggle — teams and stake are fixed at the
// tee.
//
// Game: a panel above the hole card. Every call — throw, accept, decline,
// press — is one tap and can be taken back with Undo, because on the course
// the scorer will fat-finger these.
// ---------------------------------------------------------------------------

var hmSetup={on:false};

function hammerSVG(px){
  return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 64 64" aria-hidden="true" style="flex-shrink:0;display:block">'+
    '<g transform="rotate(-28 32 32)">'+
    '<rect x="28.5" y="33" width="7" height="30" rx="2" fill="#e0a92e" stroke="#6b4e0e" stroke-width="1.5"/>'+
    '<rect x="27" y="5" width="10" height="7" rx="1.5" fill="#f5c542" stroke="#6b4e0e" stroke-width="1.5"/>'+
    '<path d="M9 11h46l4 5.5v12l-4 5.5H9l-4-5.5v-12z" fill="#f5c542" stroke="#6b4e0e" stroke-width="1.5"/>'+
    '<text x="32" y="27.5" text-anchor="middle" font-family="Bebas Neue,Impact,sans-serif" font-size="13.5" fill="#a87410" letter-spacing="0.6">HAMMER</text>'+
    '</g></svg>';
}

function setupRowCount(){ return document.querySelectorAll('#ninputs .prow').length; }

// What Tee It Up will do: Hammer on, and an even group to split into teams.
function hammerWanted(){ return hmSetup.on&&canPlayHammer(setupRowCount()); }

function teamLabel(t){ return 'Team '+(t+1); }
function teamNames(t){ return G.hammer.teams[t].join(' & '); }

function renderHammerSetup(){
  var btn=document.getElementById('hmtoggle'),sub=document.getElementById('hmsub');
  document.getElementById('hmicon').innerHTML=hammerSVG(44);
  var rows=document.querySelectorAll('#ninputs .prow'),n=rows.length;
  var even=canPlayHammer(n),on;
  if(editMode){
    on=!!G.hammer;
    btn.disabled=false; btn.classList.add('lk');
    sub.textContent=on
      ? teamNames(0)+' vs '+teamNames(1)+' · $'+G.hammer.base+'/man. Marking a team member out ends the Hammer; new players play Banker only.'
      : 'Not playing Hammer this round';
  } else {
    on=hmSetup.on&&even;
    btn.classList.remove('lk');
    btn.disabled=!even;
    sub.textContent=!even ? 'Team game — needs an even number of players'
      : on ? 'Teams are boxed below — top half vs bottom half'
      : 'Team side game · tap to play';
  }
  btn.classList.toggle('on',on);
  btn.setAttribute('aria-pressed',on?'true':'false');
  document.getElementById('hmopts').style.display=(on&&!editMode)?'flex':'none';

  // Team boxes around the rows (setup only — mid-round the rows include late
  // arrivals who aren't on a team, so the subtitle names the teams instead).
  var box=on&&!editMode,k=n/2;
  document.getElementById('rowhdr').classList.toggle('tmpad',box);
  for(var i=0;i<n;i++){
    var r=rows[i],t=i<k?0:1;
    r.classList.remove('tm','t0','t1','tmtop','tmbot');
    r.removeAttribute('data-teamlbl');
    if(!box) continue;
    r.classList.add('tm','t'+t);
    if(i===0||i===k){ r.classList.add('tmtop'); r.dataset.teamlbl=teamLabel(t).toUpperCase(); }
    if(i===k-1||i===n-1) r.classList.add('tmbot');
  }
}

function money(v){ return '$'+(Math.round(v*100)/100); }

function hammerOutcomeText(r){
  if(r.win<0) return 'Halved';
  var bits=[];
  if(r.conceded) bits.push(teamNames(otherTeam(r.win))+' declined');
  if(r.doubles) bits.push('hammer ×'+Math.pow(2,r.doubles));
  if(r.press>1) bits.push('press ×'+r.press);
  if(r.birdie) bits.push('🐦 natural birdie ×2');
  return teamNames(r.win)+' win '+money(r.value)+'/man'+(bits.length?' ('+bits.join(', ')+')':'');
}

// Teams are named by their players, not "Team 1/2" — the colour of each
// box carries the team through the throw and press buttons below it.
function hammerTeamBoxes(){
  var pt=hammerTotals(),h='<div class="hmteams">';
  for(var t=0;t<2;t++){
    var v=pt[G.hammer.teams[t][0]]||0;
    h+='<div class="hmteam t'+t+'"><span class="hmtm">'+teamNames(t)+'</span>'+
      '<span class="hmtt'+(v>0?' pos':v<0?' neg':'')+'">'+(v===0?'E':fmt(v))+'</span></div>';
  }
  return h+'</div>';
}

function renderHammer(){
  var el=document.getElementById('hmbar');
  if(!G.hammer){ el.innerHTML=''; return; }
  var hi=G.active,hole=G.holes[hi],s=hammerState(hi);
  var live=hammerLive(hi),value=hammerHoleValue(hi);

  var h='<div class="hmbar"><div class="hmhdr">'+hammerSVG(30)+'<span class="hmttl">Hammer</span>';
  h+='<span class="hmval">'+(live?money(value)+'/man this hole':'—')+'</span></div>';
  h+=hammerTeamBoxes()+'<div class="hmbody">';

  if(!live){
    var by=hammerEndedBy();
    h+='<div class="hmline"><b>The Hammer game is over.</b> '+(by?by+' left after hole '+hammerEndsAt()+', so ':'')+
      'there is no Hammer from here on — holes already played still count.</div>';
  } else if(hole.locked){
    var r=hammerHole(hi);
    h+='<div class="hmline"><b>'+(r?hammerOutcomeText(r):'No Hammer result on this hole.')+'</b></div>';
  } else if(s.pending!==null){
    var ans=otherTeam(s.pending);
    h+='<div class="hmalert"><div class="hmline"><b>🔨 '+teamNames(s.pending)+' threw the Hammer!</b><br>'+
      teamNames(ans)+' must answer now.</div><div class="hmbtns">'+
      '<button class="hmbtn hmacc" data-action="haccept">Accept<small>play for '+money(value*2)+'/man</small></button>'+
      '<button class="hmbtn hmdec" data-action="hdecline">Decline<small>'+teamNames(ans)+' pay '+money(value)+'/man</small></button>'+
      '</div></div>';
  } else if(s.conceded!==null){
    h+='<div class="hmline"><b>'+teamNames(s.conceded)+' declined — '+teamNames(otherTeam(s.conceded))+
      ' win '+money(value)+'/man.</b> The Hammer is over on this hole; finish it for the Banker game.</div>';
  } else {
    h+='<div class="hmbtns">';
    for(var t=0;t<2;t++){
      var can=canThrowHammer(hi,t),lbl=teamNames(t)+' throw the Hammer — doubles to '+money(value*2)+'/man';
      h+='<button class="hmbtn hmthrow t'+t+'" data-action="hthrow" data-v="'+t+'" aria-label="'+lbl+'" title="'+
        (can?lbl:teamNames(otherTeam(t))+' hold the Hammer')+'"'+(can?'':' disabled')+'>'+hammerSVG(44)+'</button>';
    }
    h+='</div>';
    var pr=hammerHole(hi);
    if(pr) h+='<div class="hmline">If locked now: <b>'+hammerOutcomeText(pr)+'</b></div>';
  }

  var tags=[];
  if(s.doubles) tags.push('Accepted ×'+Math.pow(2,s.doubles));
  if(hammerPressMult(hi)>1) tags.push('Press ×'+hammerPressMult(hi));
  var undo=canUndoHammer(hi);
  if(tags.length||undo){
    h+='<div class="hmrow">'+tags.map(function(x){return '<span class="hmtag">'+x+'</span>';}).join('');
    if(undo) h+='<button class="hmundo" data-action="hundo" style="margin-left:auto">↶ Undo '+lastHammerCall(hi)+'</button>';
    h+='</div>';
  }

  // Presses are round-wide, not per hole.
  var pressers=[0,1].filter(canHammerPress),ps=G.hammer.presses;
  if(ps.length){
    h+='<div class="hmpress hmrow">';
    for(var i=0;i<ps.length;i++) h+='<span class="hmtag">'+teamNames(ps[i].team)+' pressed from H'+(ps[i].from+1)+'</span>';
    if(canUndoHammerPress()) h+='<button class="hmundo" data-action="hunpress">↶ Undo press</button>';
    h+='</div>';
  }
  for(var i=0;i<pressers.length;i++){
    var t=pressers[i],from=nextUnplayedHole();
    h+='<div class="hmbtns"><button class="hmbtn hmpbtn t'+t+'" data-action="hpress" data-v="'+t+'" aria-label="'+
      teamNames(t)+' press">'+hammerSVG(34)+'<span><span class="hmpw">Press</span><small>doubles holes '+(from+1)+'–18</small></span></button></div>';
  }
  h+='</div></div>';
  el.innerHTML=h;
}

function lastHammerCall(hi){
  var log=G.hammer.log[hi],e=log[log.length-1];
  return e.t==='throw'?'throw':e.t==='accept'?'accept':'decline';
}

// The summary's one money section: Banker, Hammer and the settle-up total per
// player, ranked by what each walks away with. Without Hammer it is just the
// Banker standings in the same box.
function renderSettleUp(banker){
  var hm=!!G.hammer,pt=hm?hammerTotals():{},tot={};
  for(var i=0;i<G.players.length;i++){var p=G.players[i];tot[p]=(banker[p]||0)+(pt[p]||0);}
  var order=G.players.slice().sort(function(a,b){return tot[b]-tot[a];});
  function cls(v){return v>0?' pos':v<0?' neg':'';}

  // The bank (the app's 🏦 for the Banker game) always; the hammer beside it
  // only when Hammer was played.
  var h='<div style="display:flex;align-items:center;gap:8px"><span class="suicons">'+
    '<span style="font-size:24px;line-height:1">🏦</span>'+(hm?hammerSVG(30):'')+'</span>'+
    '<span class="hmttl">Settle Up</span>'+
    '<span class="hmval">'+(hm?'Hammer $'+G.hammer.base+'/man':'')+'</span></div>';
  if(hm) h+=hammerTeamBoxes().replace('class="hmteams"','class="hmteams" style="padding:10px 0 0"');

  h+='<table class="sutbl"><tr><th class="l"></th><th class="l">Player</th>'+
    (hm?'<th>Banker</th><th>Hammer</th><th>Settle up</th>':'<th>Total</th>')+'</tr>';
  for(var i=0;i<order.length;i++){
    var p=order[i],b=banker[p]||0,m=pt[p]||0,v=tot[p];
    h+='<tr><td class="surk'+(i===0&&v>0?' g':'')+'">'+(i+1)+'</td><td class="sunm">'+p+'</td>';
    if(hm) h+='<td class="'+cls(b).trim()+'">'+fmt(b)+'</td><td class="'+cls(m).trim()+'">'+(hammerTeamOf(p)<0?'–':fmt(m))+'</td>';
    h+='<td class="sutot'+cls(v)+'">'+fmt(v)+'</td></tr>';
  }
  h+='</table>';
  document.getElementById('smcard').innerHTML=h;
}

document.getElementById('hmtoggle').addEventListener('click',function(){
  if(editMode||!canPlayHammer(setupRowCount())) return;
  hmSetup.on=!hmSetup.on;
  renderHammerSetup(); chkValid();
});
document.getElementById('hmbase').addEventListener('input',chkValid);

// ---------------------------------------------------------------------------
// Confirm modal, autosave, resume
//
// The round lives in G (memory). It is autosaved to localStorage on every
// render so a reload, crash or dead battery doesn't lose it; New Game is the
// one deliberate way to erase it and asks twice-over in plain words. If
// storage is unavailable (private browsing, quota) the round is NOT
// recoverable, so only then does leaving the page raise the browser's
// "Leave site?" prompt.
//
// `?store=<key>` points the app at a separate key and switches the unload
// prompt off — tests.html drives this page in an iframe and must never touch
// (or be prompted over) a real round.
// ---------------------------------------------------------------------------

var gameLive=false,saveOk=true;
var STORE_PARAM=(location.search.match(/[?&]store=([^&]+)/)||[])[1];
var STORE_KEY=STORE_PARAM?decodeURIComponent(STORE_PARAM):'banker.round.v1';

function showModal(o){
  var m=document.getElementById('modal'),ok=document.getElementById('mok'),cn=document.getElementById('mcancel');
  document.getElementById('mtitle').textContent=o.title;
  document.getElementById('mbody').innerHTML=o.body;
  ok.textContent=o.okLabel; cn.textContent=o.cancelLabel;
  ok.className=o.danger?'mdanger':'mok';
  function close(){
    m.classList.remove('on');
    ok.onclick=cn.onclick=null; document.removeEventListener('keydown',onKey);
  }
  function onKey(e){ if(e.key==='Escape') cn.onclick(); }
  ok.onclick=function(){close(); if(o.onOk) o.onOk();};
  cn.onclick=function(){close(); if(o.onCancel) o.onCancel();};
  document.addEventListener('keydown',onKey);
  m.classList.add('on');
  cn.focus(); // the safe choice is the default
}

function roundProgressText(){
  var n=G.holes.filter(function(h){return h.locked;}).length;
  return n+'/18 holes scored';
}

function saveRound(){
  if(!gameLive) return;
  try{
    localStorage.setItem(STORE_KEY,serializeRound({
      awayRating:document.getElementById('awayrating').value,
      awaySlope:document.getElementById('awayslope').value}));
    saveOk=true;
  }catch(e){ saveOk=false; }
}

function clearSavedRound(){
  try{localStorage.removeItem(STORE_KEY);}catch(e){}
}

function resumeRound(o){
  loadRound(o);
  document.getElementById('awayrating').value=o.awayRating;
  document.getElementById('awayslope').value=o.awaySlope;
  var si=document.querySelectorAll('#sigrid .siinp');
  for(var i=0;i<si.length;i++) si[i].value=o.awayHoles?o.awayHoles[i].si:'';
  gameLive=true;
  hmSetup.on=!!G.hammer;
  if(G.hammer) document.getElementById('hmbase').value=G.hammer.base;
  exitEditMode(); renderSIStatus();
  showScreen('game'); renderGame();
}

function offerResume(){
  var o=null;
  try{o=parseRound(localStorage.getItem(STORE_KEY));}catch(e){}
  if(!o) return;
  var s=roundSummary(o);
  showModal({title:'Resume your round?',
    body:'A round is saved on this device: <b>'+s.players.join(', ')+'</b> — '+s.holesPlayed+'/18 holes scored.',
    okLabel:'Resume round',cancelLabel:'Start new',
    onOk:function(){resumeRound(o);},
    onCancel:function(){
      showModal({title:'Erase the saved round?',
        body:'Starting new <b>permanently erases</b> the saved round ('+s.holesPlayed+'/18 holes scored). It cannot be undone.',
        okLabel:'Erase it',cancelLabel:'Go back',danger:true,
        onOk:clearSavedRound,onCancel:offerResume});
    }});
}

if(!STORE_PARAM){
  window.addEventListener('beforeunload',function(e){
    if(!gameLive||saveOk) return;
    e.preventDefault(); e.returnValue='';
  });
}

document.getElementById('hmbase').value=HAMMER_BASE;
G.count=4;
buildInputs();
buildSIInputs();
renderCourseUI();
renderSIStatus();
offerResume();
</script>
